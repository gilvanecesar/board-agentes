<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="O galpão da memória: a memória da IA organizada como um armazém">
  <title>O galpão da memória</title>
  <defs>
    <style>
      text { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #edf1e9; }
      .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 2.6px; fill: #87958b; }
      .h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.8px; }
      .rot { font-size: 15px; font-weight: 700; }
      .sub { font-size: 13px; fill: #a8b3aa; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: #87958b; }
      .mente { font-size: 14px; font-weight: 700; text-anchor: middle; }
      .etq { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: #10140f; font-weight: 700; text-anchor: middle; }
      .passo { font-size: 15px; font-weight: 700; text-anchor: middle; }
      .ps { font-size: 13px; fill: #a8b3aa; text-anchor: middle; }
      .montante { fill: #3f6f9c; }
      .longarina { fill: #c77a3a; }
      .ico { fill: none; stroke: #b9ed80; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <!-- um palete com caixa: a memória -->
    <symbol id="palete" viewBox="0 0 40 34">
      <rect x="3" y="2" width="34" height="24" rx="2.5" fill="currentColor"/>
      <path d="M3 10h34M20 2v8" stroke="#0000003a" stroke-width="1.5"/>
      <rect x="1" y="27" width="38" height="3" fill="#8a6a44"/><rect x="3" y="30" width="5" height="4" fill="#8a6a44"/><rect x="17.5" y="30" width="5" height="4" fill="#8a6a44"/><rect x="32" y="30" width="5" height="4" fill="#8a6a44"/>
    </symbol>
    <symbol id="i-lupa" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 4.5 3.4 8 8 9 4.6-1 8-4.5 8-9V6l-8-3Z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></symbol>
    <symbol id="i-lua" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></symbol>
    <symbol id="i-lista" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></symbol>
    <linearGradient id="chao" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#171c19"/><stop offset="1" stop-color="#121614"/></linearGradient>
  </defs>

  <rect width="1600" height="1000" rx="28" fill="#111413"/>
  <text x="70" y="72" class="eyebrow">A IDEIA</text>
  <text x="70" y="114" class="h1">O galpão da memória.</text>
  <text x="70" y="146" class="sub" style="font-size:16px">Cada porta-palete é uma mente. Cada palete, uma memória. O que importa não é o espaço: é achar e separar a certa.</text>

  <!-- o galpão -->
  <rect x="60" y="180" width="1150" height="560" rx="18" fill="url(#chao)" stroke="#2b322e" stroke-width="1.5"/>
  <path d="M60 205 L635 180 L1210 205" fill="none" stroke="#2b322e" stroke-width="1.5"/>
  <text x="84" y="214" class="mono">GALPÃO · servidor da memória · posições ilimitadas</text>

  <!-- 4 porta-paletes (mentes) -->
  <g id="racks">
    <!-- rack genérico: montantes em x e x+220; níveis em y=320, 420, 520, 620 (topo das longarinas) -->
    <!-- MENTE 1: Agente da Loja -->
    <g transform="translate(95,0)">
      <rect x="0" y="250" width="10" height="400" class="montante"/><rect x="220" y="250" width="10" height="400" class="montante"/>
      <rect x="0" y="342" width="230" height="7" class="longarina"/><rect x="0" y="442" width="230" height="7" class="longarina"/><rect x="0" y="542" width="230" height="7" class="longarina"/><rect x="0" y="642" width="230" height="7" class="longarina"/>
      <use href="#palete" x="18" y="306" width="46" height="38" color="#8fc463"/><use href="#palete" x="92" y="306" width="46" height="38" color="#5f8a48"/><use href="#palete" x="166" y="306" width="46" height="38" color="#3e5a35"/>
      <use href="#palete" x="18" y="406" width="46" height="38" color="#8fc463"/><use href="#palete" x="92" y="406" width="46" height="38" color="#8fc463"/><use href="#palete" x="166" y="406" width="46" height="38" color="#5f8a48"/>
      <use href="#palete" x="18" y="506" width="46" height="38" color="#b9ed80"/><use href="#palete" x="92" y="506" width="46" height="38" color="#8fc463"/>
      <use href="#palete" x="18" y="606" width="46" height="38" color="#b9ed80"/><use href="#palete" x="92" y="606" width="46" height="38" color="#b9ed80"/><use href="#palete" x="166" y="606" width="46" height="38" color="#b9ed80"/>
      <rect x="45" y="236" width="140" height="22" rx="6" fill="#b9ed80"/><text x="115" y="252" class="etq">MENTE 01</text>
      <text x="115" y="680" class="mente">Agente da Loja</text>
      <text x="115" y="700" class="ps">pedidos, carrinho, cupom</text>
    </g>
    <!-- MENTE 2: Agente de Pagamentos -->
    <g transform="translate(365,0)">
      <rect x="0" y="250" width="10" height="400" class="montante"/><rect x="220" y="250" width="10" height="400" class="montante"/>
      <rect x="0" y="342" width="230" height="7" class="longarina"/><rect x="0" y="442" width="230" height="7" class="longarina"/><rect x="0" y="542" width="230" height="7" class="longarina"/><rect x="0" y="642" width="230" height="7" class="longarina"/>
      <use href="#palete" x="18" y="306" width="46" height="38" color="#3e5a35"/><use href="#palete" x="92" y="306" width="46" height="38" color="#3e5a35"/>
      <use href="#palete" x="18" y="406" width="46" height="38" color="#5f8a48"/><use href="#palete" x="92" y="406" width="46" height="38" color="#5f8a48"/><use href="#palete" x="166" y="406" width="46" height="38" color="#8fc463"/>
      <use href="#palete" x="18" y="506" width="46" height="38" color="#8fc463"/><use href="#palete" x="92" y="506" width="46" height="38" color="#8fc463"/><use href="#palete" x="166" y="506" width="46" height="38" color="#8fc463"/>
      <use href="#palete" x="18" y="606" width="46" height="38" color="#b9ed80"/><use href="#palete" x="92" y="606" width="46" height="38" color="#b9ed80"/>
      <rect x="45" y="236" width="140" height="22" rx="6" fill="#b9ed80"/><text x="115" y="252" class="etq">MENTE 02</text>
      <text x="115" y="680" class="mente">Agente de Pagamentos</text>
      <text x="115" y="700" class="ps">Pix, estorno, conciliação</text>
    </g>
    <!-- MENTE 3: Revisor -->
    <g transform="translate(635,0)">
      <rect x="0" y="250" width="10" height="400" class="montante"/><rect x="220" y="250" width="10" height="400" class="montante"/>
      <rect x="0" y="342" width="230" height="7" class="longarina"/><rect x="0" y="442" width="230" height="7" class="longarina"/><rect x="0" y="542" width="230" height="7" class="longarina"/><rect x="0" y="642" width="230" height="7" class="longarina"/>
      <use href="#palete" x="18" y="406" width="46" height="38" color="#5f8a48"/>
      <use href="#palete" x="18" y="506" width="46" height="38" color="#8fc463"/><use href="#palete" x="92" y="506" width="46" height="38" color="#5f8a48"/>
      <use href="#palete" x="18" y="606" width="46" height="38" color="#b9ed80"/><use href="#palete" x="92" y="606" width="46" height="38" color="#8fc463"/><use href="#palete" x="166" y="606" width="46" height="38" color="#8fc463"/>
      <rect x="45" y="236" width="140" height="22" rx="6" fill="#b9ed80"/><text x="115" y="252" class="etq">MENTE 03</text>
      <text x="115" y="680" class="mente">Revisor e QA</text>
      <text x="115" y="700" class="ps">o que já reprovou e por quê</text>
    </g>
    <!-- ÁREA COMUM -->
    <g transform="translate(905,0)">
      <rect x="0" y="250" width="10" height="400" fill="#6b7a70"/><rect x="220" y="250" width="10" height="400" fill="#6b7a70"/>
      <rect x="0" y="342" width="230" height="7" fill="#8e7a5c"/><rect x="0" y="442" width="230" height="7" fill="#8e7a5c"/><rect x="0" y="542" width="230" height="7" fill="#8e7a5c"/><rect x="0" y="642" width="230" height="7" fill="#8e7a5c"/>
      <use href="#palete" x="18" y="306" width="46" height="38" color="#edc27b"/><use href="#palete" x="92" y="306" width="46" height="38" color="#edc27b"/><use href="#palete" x="166" y="306" width="46" height="38" color="#edc27b"/>
      <use href="#palete" x="18" y="406" width="46" height="38" color="#edc27b"/><use href="#palete" x="92" y="406" width="46" height="38" color="#edc27b"/><use href="#palete" x="166" y="406" width="46" height="38" color="#edc27b"/>
      <use href="#palete" x="18" y="506" width="46" height="38" color="#edc27b"/><use href="#palete" x="92" y="506" width="46" height="38" color="#edc27b"/>
      <use href="#palete" x="18" y="606" width="46" height="38" color="#edc27b"/><use href="#palete" x="92" y="606" width="46" height="38" color="#edc27b"/><use href="#palete" x="166" y="606" width="46" height="38" color="#edc27b"/>
      <rect x="45" y="236" width="140" height="22" rx="6" fill="#edc27b"/><text x="115" y="252" class="etq">ÁREA COMUM</text>
      <text x="115" y="680" class="mente">Vale para todas</text>
      <text x="115" y="700" class="ps">regras da casa, jeito do dono</text>
    </g>
  </g>

  <!-- etiqueta de endereço apontando para um palete -->
  <path d="M231 624 L 250 588 L 300 588" stroke="#edf1e9" stroke-width="1.2" fill="none"/>
  <rect x="300" y="574" width="150" height="28" rx="6" fill="#edf1e9"/><text x="375" y="593" class="etq">R01-P01-N1-02</text>

  <!-- empilhadeira (picking) no corredor, indo para a doca -->
  <g transform="translate(1150,590)">
    <rect x="0" y="40" width="70" height="34" rx="6" fill="#edc27b"/>
    <rect x="12" y="10" width="36" height="32" rx="4" fill="none" stroke="#edc27b" stroke-width="4"/>
    <rect x="-18" y="0" width="6" height="74" fill="#c9cfc9"/><rect x="-40" y="62" width="28" height="5" fill="#c9cfc9"/>
    <use href="#palete" x="-44" y="30" width="36" height="31" color="#b9ed80"/>
    <circle cx="14" cy="78" r="10" fill="#2b322e" stroke="#87958b" stroke-width="3"/><circle cx="56" cy="78" r="10" fill="#2b322e" stroke="#87958b" stroke-width="3"/>
  </g>
  <text x="1175" y="700" class="ps">picking</text>

  <!-- doca + caminhão (o contexto do agente) -->
  <rect x="1230" y="180" width="320" height="560" rx="18" fill="#151a17" stroke="#b9ed80" stroke-width="1.5" stroke-dasharray="7 7"/>
  <text x="1254" y="214" class="mono" style="fill:#b9ed80">DOCA DE EXPEDIÇÃO</text>
  <text x="1254" y="250" class="rot">O contexto do agente</text>
  <text x="1254" y="272" class="sub">só cabe um caminhão por vez:</text>
  <text x="1254" y="292" class="sub">carregar o que a tarefa pede</text>
  <g transform="translate(1262,330)">
    <rect x="0" y="0" width="190" height="120" rx="8" fill="#1d2a1b" stroke="#b9ed80" stroke-width="2"/>
    <use href="#palete" x="12" y="66" width="46" height="38" color="#b9ed80"/><use href="#palete" x="70" y="66" width="46" height="38" color="#8fc463"/><use href="#palete" x="128" y="66" width="46" height="38" color="#edc27b"/>
    <use href="#palete" x="12" y="20" width="46" height="38" color="#8fc463"/>
    <path d="M190 30 h52 l30 36 v54 h-82z" fill="#2b322e" stroke="#b9ed80" stroke-width="2"/>
    <rect x="202" y="40" width="34" height="26" rx="3" fill="#111413"/>
    <circle cx="44" cy="126" r="16" fill="#2b322e" stroke="#87958b" stroke-width="4"/><circle cx="148" cy="126" r="16" fill="#2b322e" stroke="#87958b" stroke-width="4"/><circle cx="232" cy="126" r="16" fill="#2b322e" stroke="#87958b" stroke-width="4"/>
  </g>
  <g transform="translate(1254,500)">
    <use href="#i-lista" x="0" y="0" width="26" height="26" class="ico"/>
    <text x="36" y="18" class="rot">Romaneio</text>
    <text x="0" y="50" class="sub">o que foi carregado para a</text>
    <text x="0" y="70" class="sub">tarefa e por quê. Se o agente</text>
    <text x="0" y="90" class="sub">errar, dá para ver se faltou</text>
    <text x="0" y="110" class="sub">memória ou entrou a errada.</text>
  </g>

  <!-- rodapé: as quatro operações -->
  <g>
    <line x1="310" y1="860" x2="530" y2="860" stroke="#3b463f" stroke-width="2"/>
    <line x1="690" y1="860" x2="910" y2="860" stroke="#3b463f" stroke-width="2"/>
    <line x1="1070" y1="860" x2="1290" y2="860" stroke="#3b463f" stroke-width="2"/>

    <circle cx="230" cy="860" r="38" fill="#1d2a1b" stroke="#b9ed80" stroke-width="1.5"/><use href="#i-check" x="210" y="840" width="40" height="40" class="ico"/>
    <text x="230" y="925" class="passo">Recebimento</text><text x="230" y="947" class="ps">só entra o que foi provado</text>

    <circle cx="610" cy="860" r="38" fill="#1d2a1b" stroke="#b9ed80" stroke-width="1.5"/>
    <text x="610" y="868" style="font-size:22px;font-weight:800;fill:#b9ed80;text-anchor:middle">ABC</text>
    <text x="610" y="925" class="passo">Curva de giro</text><text x="610" y="947" class="ps">o que se usa muito fica perto da doca</text>

    <circle cx="990" cy="860" r="38" fill="#1d2a1b" stroke="#b9ed80" stroke-width="1.5"/><use href="#i-lupa" x="970" y="840" width="40" height="40" class="ico"/>
    <text x="990" y="925" class="passo">Picking</text><text x="990" y="947" class="ps">a tarefa pede, o sistema separa</text>

    <circle cx="1370" cy="860" r="38" fill="#1d2a1b" stroke="#b9ed80" stroke-width="1.5"/><use href="#i-lua" x="1350" y="840" width="40" height="40" class="ico"/>
    <text x="1370" y="925" class="passo">Inventário noturno</text><text x="1370" y="947" class="ps">junta, corrige e descarta o vencido</text>
  </g>

  <!-- legenda de cor -->
  <g transform="translate(70,772)">
    <text x="0" y="12" class="mono">COR DO PALETE</text>
    <use href="#palete" x="130" y="-4" width="22" height="19" color="#b9ed80"/><text x="158" y="12" class="mono">usada hoje</text>
    <use href="#palete" x="250" y="-4" width="22" height="19" color="#8fc463"/><text x="278" y="12" class="mono">semana</text>
    <use href="#palete" x="348" y="-4" width="22" height="19" color="#5f8a48"/><text x="376" y="12" class="mono">mês</text>
    <use href="#palete" x="424" y="-4" width="22" height="19" color="#3e5a35"/><text x="452" y="12" class="mono">parada</text>
    <use href="#palete" x="520" y="-4" width="22" height="19" color="#edc27b"/><text x="548" y="12" class="mono">área comum</text>
  </g>
</svg>
