<title>Board</title>
<link rel="stylesheet" href="/estilo.css">
<!-- Safari (26/10, pedido do dono: "aumente a fonte do board no Safari"): o tamanho é em px fixos, então o aumento é um
     zoom da página inteira, ligado ANTES de desenhar (sem piscar). Chrome e os testes não são tocados. -->
<script>if (/^((?!chrome|chromium|crios|fxios|edg|android).)*safari/i.test(navigator.userAgent)) document.documentElement.classList.add("safari");</script>
<!-- Tamanho da letra (#364, pedido do dono: "aumentar a fonte"): 16 px de padrão, A−/A+ no topo, guardado por aparelho. Aplicado antes de desenhar. -->
<script>try { const f = Number(JSON.parse(localStorage.getItem("board.fonte"))); if (f >= 13 && f <= 22) document.documentElement.style.fontSize = f + "px"; } catch {}</script>
</head>
