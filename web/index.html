<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<title>Board</title>
<style>
  :root {
    --bg: #0f1117; --panel: #1c1f26; --panel2: #16191f; --line: #2c3037; --line2: #3a3f48;
    --txt: #e8ecf1; --dim: #8b94a3; --dim2: #5e6673;
    --amber: #e8a94a; --green: #4fcf7f; --red: #ef6b6b; --cyan: #4fb8e6; --violet: #a78bfa;
    --secondary: #a78bfa;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --shadow: 0 4px 12px rgba(0, 0, 0, 0.15);
    --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.25);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--txt); font: 14px/1.6 "Inter", -apple-system, "Segoe UI", sans-serif; }
  body { padding: 0 16px 48px; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  a { color: var(--cyan); text-decoration: none; transition: opacity .2s; }
  a:hover { opacity: 0.8; }
  .wrap { max-width: 1400px; margin: 0 auto; }

  header {
    display: flex; align-items: center; gap: 14px; padding: 18px 0 12px;
    border-bottom: 1px solid var(--line); margin-bottom: 12px;
  }
  header h1 {
    font-family: "Poppins", sans-serif;
    font-size: 22px; margin: 0; letter-spacing: -0.5px; font-weight: 700;
  }
  header .stats { color: var(--dim); font-size: 13px; }
  header .stats b { color: var(--txt); font-weight: 600; }
  header .cfg { margin-left: auto; color: var(--dim2); font-size: 12px; font-family: var(--mono); }
  header .uso-cab + .cfg { margin-left: 4px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--dim2); margin-right: 6px; vertical-align: middle; }
  .dot.on { background: var(--green); box-shadow: 0 0 8px var(--green); }

  /* composer (chat pra incluir tarefas) */
  .composer {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px 16px; display: flex; flex-direction: column; gap: 12px;
    transition: all 0.2s ease;
  }
  .composer:focus-within {
    border-color: var(--violet);
    box-shadow: 0 0 0 1px rgba(167, 139, 250, 0.2);
  }
  .composer textarea { width: 100%; resize: none; background: transparent; border: 0; outline: 0; color: var(--txt); font: inherit; font-size: 15px; min-height: 26px; max-height: 240px; line-height: 1.5; }
  .composer textarea::placeholder { color: var(--dim2); }
  .composer .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .composer select, .composer input.mini {
    background: var(--panel2); color: var(--txt); border: 1px solid var(--line2);
    border-radius: 8px; padding: 10px 12px; font: inherit; font-size: 13.5px;
    height: 40px; display: flex; align-items: center;
    transition: border-color 0.2s ease;
  }
  .composer select:focus, .composer input.mini:focus { border-color: var(--violet); }
  .composer select { min-width: 130px; }
  .composer input.mini { width: 140px; }
  .composer input.mini::placeholder { color: var(--dim2); }
  .composer label.tog { color: var(--dim); font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .composer .hint { color: var(--dim2); font-size: 12px; line-height: 1.4; }
  .composer.arrastando { border-color: var(--amber); background: rgba(232,169,74,.06); }
  .anexos { display: flex; flex-wrap: wrap; gap: 8px; }
  .anexo { position: relative; width: 84px; height: 62px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line2); background: var(--panel2); }
  .anexo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .anexo .x { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 50%; background: rgba(0,0,0,.65); color: #fff; font-size: 12px; line-height: 18px; text-align: center; cursor: pointer; }
  .pdf { display: flex; flex-direction: column; justify-content: center; gap: 2px; height: 100%; min-height: 62px; padding: 6px 8px; box-sizing: border-box; color: var(--dim); font-size: 11px; overflow: hidden; }
  .pdf b { color: var(--txt); font-size: 12px; }
  .pdf span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .anexo.subindo { display: grid; place-items: center; color: var(--dim2); font-size: 11px; font-family: var(--mono); }
  .ev .fotos { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .ev .fotos a { display: block; width: 120px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line2); }
  .ev .fotos img { width: 100%; display: block; }
  .dhead .fotos { display: flex; flex-wrap: wrap; gap: 8px; }
  .dhead .fotos a { display: block; width: 110px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line2); }
  .dhead .fotos img { width: 100%; display: block; }
  .ib.clipe {
    width: 40px !important;
    height: 40px !important;
    font-size: 18px;
    cursor: pointer;
  }
  .composer #addBtn {
    margin-left: auto;
  }
  .btn {
    background: var(--panel2); border: 1px solid var(--line2); border-radius: 8px;
    padding: 0 16px; font-size: 13.5px; font-weight: 600;
    height: 40px; display: inline-flex; align-items: center; justify-content: center;
    line-height: 1;
    transition: all 0.2s ease;
  }
  .btn:hover:not(:disabled) {
    border-color: var(--dim);
    background: var(--line2);
  }
  .btn.primary {
    background: var(--cyan); color: var(--bg); border-color: var(--cyan);
    font-weight: 700;
  }
  .btn.primary:hover:not(:disabled) {
    opacity: 0.9;
    box-shadow: 0 4px 12px rgba(79, 184, 230, 0.3);
  }
  .btn.danger:hover:not(:disabled) { color: var(--red); border-color: var(--red); }
  .btn.sm { padding: 4px 9px; font-size: 12px; }

  /* lista */
  .cols { display: none; }
  .list { display: flex; flex-direction: column; gap: 8px; }
  /* Aba Pendentes: um cabeçalho por projeto e as ações sempre à vista (é lista de lembrete). */
  .grupo { display: flex; align-items: center; gap: 8px; padding: 14px 2px 2px; font-size: 12px; font-family: var(--mono); text-transform: uppercase; letter-spacing: .6px; }
  .grupo:first-child { padding-top: 2px; }
  .grupo .proj { color: var(--violet); }
  .grupo b { color: var(--dim2); font-weight: 600; }
  .list.pendentes .task .acts { opacity: 1; }
  .task .meta .idade { color: var(--amber); }
  .task {
    display: grid; grid-template-columns: 32px 1fr auto; gap: 12px; align-items: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; transition: all 0.2s ease-out;
  }
  .task:hover {
    border-color: var(--line2);
    box-shadow: var(--shadow);
  }
  .task.rodando {
    border-color: rgba(232,169,74,.55);
    box-shadow: inset 3px 0 0 var(--amber), var(--shadow);
  }
  .task.dragging { opacity: .4; }
  .task.over { border-color: var(--amber); }
  .task .chk { width: 24px; height: 24px; border-radius: 6px; border: 2px solid var(--dim2); display: grid; place-items: center; color: #0d2415; font-weight: 700; font-size: 14px; transition: all 0.2s ease; }
  .task .chk:hover { border-color: var(--green); }
  .task .chk.on { background: var(--green); border-color: var(--green); }
  .task .main { min-width: 0; cursor: pointer; }
  .task .title { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .task.concluida .title { color: var(--dim); text-decoration: line-through; }
  /* A linha de meta é UMA linha: nada estica na altura, nada quebra; só a "última ação" encolhe. */
  .task .meta { color: var(--dim2); font-size: 12px; display: flex; align-items: center; gap: 8px; margin-top: 3px; font-family: var(--mono); min-width: 0; overflow: hidden; }
  .task .meta > * { flex: 0 0 auto; white-space: nowrap; line-height: 1.4; }
  .task .meta .proj { color: var(--violet); }
  .task .meta .last { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .task .right { display: flex; align-items: center; gap: 6px; }
  .task .acts { display: flex; gap: 2px; opacity: 0; transition: opacity .15s; }
  .task:hover .acts, .task.rodando .acts { opacity: 1; }
  .ib { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--dim); font-size: 15px; transition: all 0.2s ease; }
  .ib:hover:not(:disabled) { background: var(--line2); color: var(--txt); }
  .ib.del:hover { color: var(--red); background: rgba(239,107,107,.1); }
  .grip { cursor: grab; color: var(--dim2); font-size: 16px; padding: 0 2px; }

  .pill {
    font-size: 11px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase;
    padding: 5px 11px; border-radius: 6px; border: 1px solid var(--line2);
    color: var(--dim); white-space: nowrap; min-width: 92px; text-align: center;
    transition: all 0.2s ease;
  }
  .pill.pendente { }
  .pill.fila { color: var(--cyan); border-color: rgba(79,184,230,.35); background: rgba(79,184,230,.08); }
  .pill.rodando {
    color: var(--amber); border-color: rgba(232,169,74,.55);
    background: rgba(232,169,74,.12);
    font-weight: 700;
  }
  .pill.executada { color: var(--green); border-color: rgba(79,207,127,.35); background: rgba(79,207,127,.08); }
  .pill.concluida { color: var(--green); background: rgba(79,207,127,.12); border-color: transparent; }
  .pill.erro { color: var(--red); border-color: rgba(239,107,107,.4); background: rgba(239,107,107,.08); }
  .pill.rodando::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--amber); margin-right: 6px; animation: blink 1s infinite; vertical-align: 1px; }
  @keyframes blink { 50% { opacity: .2; } }

  .empty { color: var(--dim2); text-align: center; padding: 40px 0; }
  .tabs {
    display: flex; gap: 4px; margin-top: 20px; margin-bottom: 16px;
    border-bottom: 1px solid var(--line); flex-wrap: wrap;
  }
  .tab {
    padding: 12px 14px; color: var(--dim); font-size: 13px; font-weight: 500;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
    transition: all 0.2s ease;
  }
  .tab:hover {
    color: var(--txt);
  }
  .tab.on {
    color: var(--txt);
    border-bottom-color: var(--cyan);
    font-weight: 600;
  }
  .tab b { color: var(--dim2); font-weight: 600; margin-left: 6px; font-size: 11px; }
  .tab.on b { color: var(--cyan); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 2px 0; }
  .chip { display: flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line2); color: var(--dim); font-size: 12.5px; font-weight: 600; }
  .chip:hover { color: var(--txt); border-color: var(--dim); }
  .chip.on { color: var(--txt); border-color: var(--violet); background: rgba(167,139,250,.12); }
  .chip b { color: var(--dim2); font-weight: 600; }
  .chip.on b { color: var(--violet); }
  .chip i { width: 6px; height: 6px; border-radius: 50%; background: var(--amber); animation: blink 1s infinite; }
  .selo { display: inline-flex; align-items: center; height: 18px; border-radius: 5px; padding: 0 6px; font-size: 10.5px; font-weight: 700; letter-spacing: .3px; border: 1px solid var(--line2); white-space: nowrap; }
  .selo.ok { color: var(--green); border-color: rgba(79,207,127,.4); }
  .selo.nao { color: var(--red); border-color: rgba(239,107,107,.45); }
  .ev.portao, .ev.revisor { border-radius: 12px; padding: 10px 14px; border: 1px solid var(--line2); background: var(--panel); }
  .ev.portao .k, .ev.revisor .k { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; font-family: var(--mono); margin-bottom: 6px; display: flex; gap: 12px; align-items: center; }
  .ev.ok { border-color: rgba(79,207,127,.4); background: rgba(79,207,127,.07); }
  .ev.ok .k { color: var(--green); }
  .ev.nao { border-color: rgba(239,107,107,.45); background: rgba(239,107,107,.07); }
  .ev.nao .k { color: var(--red); }
  .ev pre { margin: 0; font-family: var(--mono); font-size: 12px; color: var(--dim); white-space: pre-wrap; word-break: break-word; max-height: 300px; overflow: auto; }
  .ev.revisor .txt { white-space: pre-wrap; word-break: break-word; }
  .ev.ferramenta.rev b { color: var(--violet); }
  /* consumo: cores VALIDADAS pro fundo escuro (agente âmbar, revisor ciano); texto sempre em tokens de texto */
  :root { --c-agente: #bd7d1a; --c-revisor: #2892c7; --c-qa: #c0569a; }
  .cons { display: flex; flex-direction: column; gap: 18px; padding-top: 16px; }
  .cons .aviso { color: var(--dim2); font-size: 12.5px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .tile {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px 14px; transition: all 0.2s ease;
  }
  .tile:hover {
    border-color: var(--line2);
    box-shadow: var(--shadow);
    transform: translateY(-2px);
  }
  .tile .k { color: var(--dim2); font-size: 11.5px; text-transform: uppercase; letter-spacing: .5px; font-family: var(--mono); font-weight: 600; }
  .tile .v { font-size: 28px; font-weight: 700; margin-top: 8px; letter-spacing: -0.5px; }
  .tile .s { color: var(--dim2); font-size: 12px; margin-top: 4px; }
  .bloco { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .bloco h3 { margin: 0 0 10px; font-size: 13px; font-weight: 600; color: var(--dim); }

  /* monitoring premium */
  .mon-premium { padding: 24px 0; }
  .mon-header { text-align: center; margin-bottom: 32px; }
  .mon-header h2 { margin: 0 0 8px; font-size: 22px; font-weight: 700; letter-spacing: -.3px; }
  .mon-header p { margin: 0; color: var(--dim); font-size: 13px; }
  .mon-canvas { margin: 0 auto 32px; max-width: 600px; }
  .mon-svg { width: 100%; height: auto; }
  .pulse-ring { animation: pulse-ring 2s infinite; }
  @keyframes pulse-ring { 0% { r: 55px; opacity: 1; } 100% { r: 75px; opacity: 0; } }
  @keyframes flow-line { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 20px; } }
  @keyframes flow-backup { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 20px; } }
  .mon-line { fill: none; stroke-linecap: round; stroke-dasharray: 10, 10; transition: stroke .3s; }
  .mon-dot { transition: fill .3s, filter .3s; }
  .mon-dot.on { fill: var(--green); filter: drop-shadow(0 0 6px rgba(79,207,127,.8)); }
  .mon-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; max-width: 650px; margin: 0 auto; }
  .mon-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; transition: all .3s; }
  .mon-card:hover { border-color: var(--line2); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.2); }
  .mon-card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .mon-icon { font-size: 18px; }
  .mon-label { font-size: 13px; font-weight: 600; color: var(--txt); }
  .mon-status-text { font-size: 12px; color: var(--dim); font-family: var(--mono); }
  .mon-footer { text-align: center; margin-top: 20px; font-size: 12px; color: var(--dim2); display: flex; justify-content: center; gap: 16px; }
  .mon-auto { font-size: 11px; }

  .brow { display: grid; grid-template-columns: 130px 1fr 70px; align-items: center; gap: 10px; padding: 4px 0; }
  .brow .n { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brow .n.mono { font-family: var(--mono); font-size: 12px; color: var(--dim); }
  .brow .t { height: 10px; background: var(--panel2); border-radius: 0 4px 4px 0; overflow: hidden; }
  .brow .b { height: 100%; background: var(--c-agente); border-radius: 0 4px 4px 0; min-width: 2px; }
  .brow .v { font-family: var(--mono); font-size: 12px; text-align: right; color: var(--txt); }
  /* por motor: sem barra de propósito — não se compara dólar com token (cada CLI conta o seu) */
  .mrow { display: grid; grid-template-columns: 1fr auto auto; gap: 16px; align-items: baseline; padding: 6px 0; border-top: 1px solid var(--line); }
  .mrow:first-of-type { border-top: 0; }
  .mrow .n { font-size: 13px; }
  .mrow .r { color: var(--dim2); font-size: 12px; font-family: var(--mono); }
  .mrow .v { font-family: var(--mono); font-size: 13px; white-space: nowrap; text-align: right; }
  .dias { display: grid; grid-template-columns: repeat(14, 1fr); gap: 2px; align-items: end; height: 90px; }
  .dias .d { background: var(--c-agente); border-radius: 4px 4px 0 0; min-height: 2px; position: relative; }
  .dias .d.zero { background: var(--panel2); }
  .dias .d.hoje { outline: 2px solid var(--txt); outline-offset: -2px; }
  .dias-l { display: grid; grid-template-columns: repeat(14, 1fr); gap: 2px; margin-top: 4px; color: var(--dim2); font-size: 10px; font-family: var(--mono); text-align: center; }
  .split { display: flex; height: 12px; gap: 2px; border-radius: 4px; overflow: hidden; background: var(--panel2); }
  .split .a { background: var(--c-agente); } .split .r { background: var(--c-revisor); } .split .q { background: var(--c-qa); }
  .legend { display: flex; gap: 16px; margin-top: 8px; font-size: 12.5px; color: var(--dim); flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .legend b { color: var(--txt); font-weight: 600; }
  table.top { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.top th { text-align: left; color: var(--dim); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .4px; padding: 4px 6px; border-bottom: 1px solid var(--line); }
  table.top td { padding: 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.top td.num { font-family: var(--mono); text-align: right; white-space: nowrap; }
  table.top tr:hover td { background: var(--panel2); cursor: pointer; }
  /* plano de cada motor (/usage): status com rótulo, nunca só cor */
  .plano { display: flex; flex-direction: column; gap: 12px; }
  .plano > .empty, .plano > .cab, .plano > .nota, .plano > .medidores, .plano > .contrib, .plano > pre { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; margin: 0; }
  /* um cartão por CLI, lado a lado: medidor grande, barras por janela e a troca num clique */
  .mgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
  .mcard { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .mcard.esgotado { border-color: rgba(239,107,107,.55); background: rgba(239,107,107,.06); }
  .mcard.mudo { opacity: .85; }
  .mcard .mtop { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .mcard .mnome { font-size: 15px; font-weight: 700; letter-spacing: -.2px; }
  .mcard .quando { color: var(--dim2); font-size: 11.5px; font-family: var(--mono); margin-left: auto; }
  .mtag { display: inline-flex; align-items: center; height: 19px; border-radius: 5px; padding: 0 7px; font-size: 10.5px; font-weight: 700; letter-spacing: .3px; border: 1px solid var(--line2); color: var(--dim); white-space: nowrap; }
  .mtag.padrao { color: var(--violet); border-color: rgba(167,139,250,.45); }
  .mtag.esgotada { color: var(--red); border-color: rgba(239,107,107,.5); background: rgba(239,107,107,.14); }
  .mtag.livre { color: var(--green); border-color: rgba(79,207,127,.4); }
  .mcard .mgrande { font-size: 30px; font-weight: 700; letter-spacing: -.6px; line-height: 1.05; }
  .mcard .mgrande.limite { color: var(--red); }
  .mcard .mgrande small { font-size: 12.5px; color: var(--dim); font-weight: 500; margin-left: 8px; letter-spacing: 0; }
  .mcard .msem { color: var(--dim2); font-size: 12.5px; line-height: 1.5; }
  .mlims { display: flex; flex-direction: column; gap: 9px; }
  .mlim .lr { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 12.5px; color: var(--dim); margin-bottom: 3px; }
  .mlim .lr b { color: var(--txt); font-family: var(--mono); font-weight: 600; }
  .mlim .lr b.limite { color: var(--red); }
  .mcard .trilho { height: 8px; background: var(--panel2); border-radius: 4px; overflow: hidden; }
  .mlim .quando2 { color: var(--dim2); font-size: 11.5px; margin-top: 3px; display: flex; gap: 8px; flex-wrap: wrap; }
  .mcard details { font-size: 12.5px; color: var(--dim); }
  .mcard details summary { cursor: pointer; color: var(--dim2); font-size: 12px; }
  .mcard details .contrib { border-top: 0; padding-top: 8px; }
  .mrod { display: flex; gap: 8px 14px; flex-wrap: wrap; align-items: center; color: var(--dim); font-size: 12px; font-family: var(--mono); border-top: 1px solid var(--line); padding-top: 9px; margin-top: auto; }
  .mrod .btn { margin-left: auto; }
  .mdest { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--dim2); font-size: 12px; }
  .plano .alerta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; border: 1px solid rgba(239,107,107,.5); background: rgba(239,107,107,.1); color: var(--red); border-radius: 12px; padding: 10px 14px; font-size: 13px; font-weight: 600; }
  .plano .mem { display: flex; gap: 10px; align-items: flex-start; border: 1px dashed var(--line2); border-radius: 12px; padding: 10px 14px; color: var(--dim); font-size: 12.5px; line-height: 1.55; }
  .plano .mem b { color: var(--txt); font-weight: 600; }
  .plano .cab { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .plano .cab h3 { margin: 0; font-size: 14px; font-weight: 600; color: var(--txt); }
  .plano .cab .quando { color: var(--dim2); font-size: 12px; font-family: var(--mono); }
  .plano .cab .btn { margin-left: auto; }
  .medidores { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; }
  .medidor .l1 { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
  .medidor .l1 .n { color: var(--dim); }
  .medidor .l1 .p { color: var(--txt); font-weight: 600; font-family: var(--mono); }
  .medidor .grande { font-size: 22px; font-weight: 700; letter-spacing: -.3px; margin: 2px 0 6px; }
  .medidor .grande small { font-size: 12.5px; color: var(--dim); font-weight: 500; margin-left: 6px; letter-spacing: 0; }
  .medidor .trilho { height: 8px; background: var(--panel2); border-radius: 4px; overflow: hidden; }
  .medidor .enche { height: 100%; border-radius: 0 4px 4px 0; min-width: 2px; }
  .enche.ok { background: var(--green); } .enche.atencao { background: var(--amber); } .enche.limite { background: var(--red); }
  .medidor .l3 { color: var(--dim2); font-size: 12px; margin-top: 5px; display: flex; gap: 8px; flex-wrap: wrap; }
  .medidor .rot { font-weight: 600; }
  .rot.atencao { color: var(--amber); } .rot.limite { color: var(--red); }
  .contrib { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
  .contrib h4 { margin: 0 0 2px; font-size: 12.5px; color: var(--txt); font-weight: 600; }
  .contrib .res { color: var(--dim2); font-size: 12px; font-family: var(--mono); margin-bottom: 6px; }
  .contrib ul { margin: 0; padding-left: 16px; color: var(--dim); font-size: 12.5px; line-height: 1.6; }
  .plano .nota { color: var(--dim2); font-size: 12px; }
  .uso-cab { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line2); color: var(--dim); font-size: 12px; font-family: var(--mono); cursor: pointer; white-space: nowrap; }
  .uso-cab:hover { color: var(--txt); border-color: var(--dim); }
  .uso-cab i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .uso-cab i.ok { background: var(--green); } .uso-cab i.atencao { background: var(--amber); } .uso-cab i.limite { background: var(--red); }
  .tag-pr { display: inline-flex; align-items: center; height: 18px; color: var(--cyan); border: 1px solid rgba(79,184,230,.4); border-radius: 5px; padding: 0 6px; font-size: 10.5px; font-weight: 700; letter-spacing: .4px; white-space: nowrap; }
  .meta a.prlink { color: var(--cyan); text-decoration: none; }
  .meta a.prlink:hover { text-decoration: underline; }

  /* busca semântica */
  .bhead { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .bhead .brow1 { display: flex; gap: 12px; align-items: center; }
  .bhead .search-box {
    flex: 1; display: flex; align-items: center;
    background: var(--panel2); border: 1px solid var(--line2);
    border-radius: 10px; padding: 0 12px; height: 40px;
    transition: border-color 0.2s ease;
  }
  .bhead .search-box:focus-within { border-color: var(--violet); }
  .bhead input {
    flex: 1; background: transparent; border: 0;
    color: var(--txt); font: inherit; font-size: 15px; outline: 0;
    padding: 10px 0;
  }
  .bhead input::placeholder { color: var(--dim2); }
  .bhead .clear-btn {
    width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
    color: var(--dim2); font-size: 16px; cursor: pointer; opacity: 0;
    transition: all 0.2s ease;
  }
  .bhead .search-box:has(input:not(:placeholder-shown)) .clear-btn {
    opacity: 1;
  }
  .bhead .clear-btn:hover { color: var(--txt); }
  .bhead select {
    height: 40px; padding: 10px 12px; min-width: 150px;
    background: var(--panel2); color: var(--txt); border: 1px solid var(--line2);
    border-radius: 8px; font: inherit; font-size: 13.5px;
    transition: border-color 0.2s ease;
  }
  .bhead select:focus { border-color: var(--violet); }
  .bhead .hint { color: var(--dim2); font-size: 12px; line-height: 1.5; }
  .bhead .hint code { font-family: var(--mono); color: var(--dim); }
  .linkish { color: var(--cyan); font-size: 12px; padding: 0 4px; }
  .linkish:hover { text-decoration: underline; }
  .bcount { color: var(--dim2); font-size: 12px; font-family: var(--mono); padding: 16px 2px 8px; }
  .bres { display: grid; grid-template-columns: 74px 1fr; gap: 12px; align-items: start; padding: 11px 14px; border-radius: 12px; border: 1px solid transparent; cursor: pointer; }
  .bres:hover { background: var(--panel); border-color: var(--line); }
  .bres .title { font-size: 14.5px; }
  .bres .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--dim2); font-size: 12px; margin-top: 4px; }
  .bres .meta .proj { color: var(--violet); font-weight: 600; }
  .bres .btrecho { color: var(--dim); font-size: 12.5px; margin-top: 5px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .bscore { display: flex; flex-direction: column; gap: 4px; padding-top: 3px; }
  .bscore span { color: var(--dim); font-size: 11px; font-family: var(--mono); text-align: right; }
  .bbar { height: 6px; background: var(--panel2); border-radius: 999px; overflow: hidden; }
  .bbar i { display: block; height: 100%; background: var(--violet); border-radius: 999px; }
  .bhist { margin-top: 24px; border-top: 1px solid var(--line); padding-top: 12px; }
  .bhist h3 { margin: 0 0 8px; font-size: 12px; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: .5px; }
  .bhist .bh { display: flex; gap: 10px; align-items: baseline; padding: 5px 6px; border-radius: 8px; cursor: pointer; }
  .bhist .bh:hover { background: var(--panel); }
  .bhist .bh .q { font-size: 13px; }
  .bhist .bh .s { color: var(--dim2); font-size: 11.5px; font-family: var(--mono); margin-left: auto; white-space: nowrap; }

  /* detalhe */
  .detail header { flex-wrap: wrap; }
  .back { color: var(--dim); font-size: 14px; padding: 4px 8px 4px 0; }
  .back:hover { color: var(--txt); }
  /* O topo acompanha a rolagem: numa linha do tempo longa, o dono perde de vista QUAL tarefa
     está lendo e some com os botões (Parar, Rodar de novo). */
  .dtop { position: sticky; top: 0; z-index: 5; background: var(--bg); padding-bottom: 10px; box-shadow: 0 10px 12px -10px rgba(0,0,0,.75); }
  .dtop header { padding: 12px 0 10px; }
  .dhead { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
  .dhead .t { font-size: 17px; font-weight: 600; white-space: pre-wrap; cursor: pointer; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .dhead .t.aberto { -webkit-line-clamp: unset; }
  .dhead .t::after { content: ""; }
  .dhead .m { display: flex; flex-wrap: wrap; gap: 12px; color: var(--dim); font-size: 12.5px; font-family: var(--mono); align-items: center; }
  .dhead .m > select { height: 40px; padding: 10px 12px; min-width: 140px; background: var(--panel2); color: var(--txt); border: 1px solid var(--line2); border-radius: 8px; font: inherit; font-size: 13.5px; }
  .dhead .m > * { line-height: 1.4; }
  .dhead select {
    background: var(--panel2); color: var(--txt); border: 1px solid var(--line2);
    border-radius: 8px; padding: 10px 12px; height: 40px;
    font: inherit; font-size: 13.5px; min-width: 140px;
    transition: border-color 0.2s ease;
  }
  .dhead select:focus { border-color: var(--violet); }
  .dhead .dh1 { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .dhead .hint { color: var(--dim2); font-size: 12px; line-height: 1.4; }
  .dhead .acts { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
  .dhead .acts .btn { height: 40px; }
  .passar { display: inline-flex; align-items: center; gap: 6px; color: var(--dim); font-size: 12.5px; border-left: 1px solid var(--line2); padding-left: 10px; }

  /* O espaço no fim é o que impede a caixa de conversa (que flutua na rolagem) de cobrir
     a última mensagem — era o caso quando o agente acabava de responder. */
  .timeline { margin-top: 16px; display: flex; flex-direction: column; gap: 6px; min-height: 120px; padding-bottom: 76px; }
  .ev { max-width: 100%; }
  .ev.texto { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; word-break: break-word; }
  /* markdown da resposta do agente (mdToHtml): o mesmo jeito de ler do terminal, com tabela de verdade */
  .md { font-size: 14px; line-height: 1.65; }
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md p { margin: 0 0 10px; }
  .md strong { color: var(--txt); font-weight: 700; }
  .md em { font-style: italic; }
  .md a { color: var(--cyan); text-decoration: underline; text-underline-offset: 2px; }
  .md h2, .md h3, .md h4 { margin: 16px 0 8px; font-weight: 700; line-height: 1.3; text-wrap: balance; }
  .md h2 { font-size: 17px; } .md h3 { font-size: 15.5px; } .md h4 { font-size: 14px; color: var(--dim); text-transform: uppercase; letter-spacing: .4px; }
  .md ul, .md ol { margin: 0 0 10px; padding-left: 22px; }
  .md li { margin: 3px 0; }
  .md li.sub { margin-left: 18px; list-style-type: circle; }
  .md li::marker { color: var(--dim2); }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
  .md blockquote { margin: 0 0 10px; padding: 6px 12px; border-left: 3px solid var(--line2); color: var(--dim); }
  .md code { background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; font-family: var(--mono); font-size: 12.5px; }
  .md pre.md-code { margin: 0 0 10px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-x: auto; }
  .md pre.md-code code { background: none; border: 0; padding: 0; font-size: 12.5px; line-height: 1.5; white-space: pre; }
  .md .md-tw { overflow-x: auto; margin: 0 0 12px; }
  .md-table { border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; min-width: 50%; }
  .md-table th, .md-table td { border: 1px solid var(--line2); padding: 7px 12px; text-align: left; vertical-align: top; }
  .md-table th { font-weight: 700; color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .4px; background: var(--panel2); }
  .md-table tbody tr:hover td { background: rgba(79,184,230,.05); }
  .ev.texto.ao-vivo { border-style: dashed; }
  .ev.dono { align-self: flex-end; max-width: 80%; background: rgba(232,169,74,.13); border: 1px solid rgba(232,169,74,.4); border-radius: 12px; padding: 10px 14px; white-space: pre-wrap; word-break: break-word; }
  .ev.ferramenta { font-family: var(--mono); font-size: 12.5px; color: var(--dim); padding: 2px 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev.ferramenta b { color: var(--cyan); font-weight: 600; }
  .ev.solto { font-family: var(--mono); font-size: 12px; color: var(--dim2); padding: 2px 14px; white-space: pre-wrap; }
  .ev.resultado { background: rgba(79,207,127,.07); border: 1px solid rgba(79,207,127,.35); border-radius: 12px; padding: 10px 14px; word-break: break-word; }
  .ev.resultado.slim { padding: 6px 14px; }
  .ev.resultado.slim .k { margin: 0; }
  .ev.resultado .k { color: var(--green); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; font-family: var(--mono); margin-bottom: 6px; display: flex; gap: 12px; }
  .ev.mark { color: var(--dim2); font-size: 12px; font-family: var(--mono); text-align: center; padding: 8px 0 2px; }
  .ev.mark.err { color: var(--red); }
  .ev .at { color: var(--dim2); font-size: 11px; font-family: var(--mono); margin-bottom: 4px; }
  .thinking { color: var(--amber); font-family: var(--mono); font-size: 12.5px; padding: 8px 14px; }
  .thinking::after { content: "…"; animation: blink 1s infinite; }

  .chatbox { position: sticky; bottom: 12px; margin-top: 16px; background: var(--panel); border: 1px solid var(--line2); border-radius: 14px; padding: 10px 12px; display: flex; gap: 10px; align-items: flex-end; box-shadow: 0 8px 30px rgba(0,0,0,.4); }
  .chatbox textarea { flex: 1; resize: none; background: transparent; border: 0; outline: 0; color: var(--txt); font: inherit; font-size: 14.5px; max-height: 200px; line-height: 1.5; }
  .chatbox .note { color: var(--dim2); font-size: 12px; padding: 0 4px 8px; }

  /* ⚡ agentes: o nome (#eng01…) e o modelo de quem está trabalhando */
  .agente { display: inline-flex; align-items: center; gap: 4px; height: 18px; border-radius: 5px; padding: 0 6px; font-size: 10.5px; font-weight: 700; letter-spacing: .2px; font-family: var(--mono); color: var(--cyan); border: 1px solid rgba(79,184,230,.35); white-space: nowrap; }
  .agente.on { background: rgba(79,184,230,.12); }
  .agentes { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 12px; }
  .agente-chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 10px; border: 1px solid rgba(79,184,230,.35); background: rgba(79,184,230,.06); color: var(--txt); font-size: 12.5px; text-decoration: none; }
  .agente-chip:hover { border-color: var(--cyan); opacity: 1; }
  .agente-chip b { color: var(--cyan); font-family: var(--mono); }
  .agente-chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--amber); animation: blink 1s infinite; }
  .agente-chip span { color: var(--dim); }
  .toast.info { background: var(--panel); color: var(--txt); border-color: var(--line2); box-shadow: var(--shadow-lg); }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: #2a1c1c; color: #ffb4b4; border: 1px solid var(--red); padding: 8px 14px; border-radius: 10px; font-size: 13px; z-index: 9; }
  @media (max-width: 640px) {
    .task .meta .last { display: none; }
    .task .acts { opacity: 1; }
    .cols { display: none; }
  }

  /* Board workspace — shared visual system for every view. */
  :root {
    color-scheme: dark;
    --bg: #111413; --panel: #191d1b; --panel2: #141816;
    --line: #2b322e; --line2: #3b463f;
    --txt: #edf1e9; --dim: #a8b3aa; --dim2: #87958b;
    --cyan: #b9ed80; --violet: #a9c7af; --secondary: #a9c7af;
    --green: #a7dc7a; --amber: #edc27b; --red: #f1948e;
    --shadow: 0 4px 20px #0002; --shadow-lg: 0 20px 70px #0005;
  }
  html, body { font-family: 'DM Sans', sans-serif; }
  body { padding: 0 36px 40px 264px; }
  h1,h2,h3,.brand,.page-intro h2,.overview strong { font-family: 'Manrope', sans-serif; }
  ::selection { background: #b9ed8044; }
  :focus-visible { outline: 2px solid var(--cyan); outline-offset: 4px; }
  button, a, input, textarea, select { -webkit-tap-highlight-color: transparent; }
  button { transition: background .2s ease-out, border-color .2s ease-out, color .2s ease-out; }
  input[type=checkbox] { accent-color: var(--cyan); }
  [hidden] { display: none !important; }
  .wrap { max-width: 1560px; }
  .skip-link { position: fixed; left: 250px; top: -70px; z-index: 30; background: var(--cyan); color: var(--bg); padding: 10px; }
  .skip-link:focus { top: 8px; }
  .sidebar { position: fixed; inset: 0 auto 0 0; width: 228px; padding: 30px 18px 20px; background: #171b18; border-right: 1px solid var(--line); display: flex; flex-direction: column; z-index: 10; overflow-y: auto; }
  .brand { display: flex; align-items: center; gap: 11px; padding: 0 10px 35px; color: var(--txt); font-size: 28px; font-weight: 800; letter-spacing: -1.5px; }
  .brand-mark { display: grid; grid-template-columns: repeat(2,7px); gap: 3px; padding: 9px; border-radius: 10px; background: var(--cyan); transform: rotate(-6deg); }
  .brand-mark i { width: 7px; height: 16px; border-radius: 2px; background: #203018; }
  .brand-mark i:last-child { height: 11px; margin-top: 5px; }
  .nav-label,.eyebrow { color: var(--dim2); text-transform: uppercase; font-size: 10px; font-weight: 700; letter-spacing: 1.7px; }
  .nav-label { padding: 18px 12px 10px; }
  .nav-item { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; padding: 12px; margin: 3px 0; border-radius: 8px; color: var(--dim); font-size: 13px; }
  .nav-item svg { width: 18px; height: 18px; flex: none; }
  .nav-item:hover { color: var(--txt); background: #ffffff06; }
  .nav-item.active { color: var(--cyan); background: #b9ed8010; box-shadow: inset 2px 0 var(--cyan); }
  .nav-item small { margin-left: auto; color: var(--dim2); font-size: 11px; }
  .sidebar-bottom { margin-top: auto; padding: 30px 12px 0; }
  .workspace-badge { display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--line); padding-top: 18px; }
  .workspace-avatar { width: 32px; height: 32px; display: grid; place-items: center; background: #29322b; color: var(--cyan); border-radius: 9px; font-size: 12px; font-weight: 700; }
  .workspace-badge b { display: block; font-size: 12px; font-weight: 500; }
  .workspace-badge small { display: block; color: var(--dim2); font-size: 10px; }
  header { min-height: 78px; gap: 12px; padding: 18px 0; margin-bottom: 30px; flex-wrap: wrap; }
  header h1 { font: 600 13px 'DM Sans',sans-serif; letter-spacing: 0; color: var(--dim); }
  header .stats { display: none; }
  header .cfg { font: 11px 'DM Sans',sans-serif; }
  .uso-cab { font: 11px 'DM Sans',sans-serif; padding: 6px 10px; background: var(--panel); }
  .dot.on { box-shadow: none; }
  .page-intro { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin: 8px 0 28px; }
  .page-intro h2 { font-size: clamp(25px,3vw,36px); letter-spacing: -1.4px; margin: 5px 0 6px; font-weight: 700; line-height: 1.3; }
  .page-intro p { margin: 0; color: var(--dim); font-size: 13px; }
  .page-date { color: var(--dim2); font-size: 12px; text-transform: capitalize; white-space: nowrap; }
  .overview { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); margin: 0 0 28px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); overflow: hidden; }
  .overview button { text-align: left; padding: 18px 22px; border-right: 1px solid var(--line); }
  .overview button:last-child { border-right: 0; }
  .overview button:hover { background: #ffffff04; }
  .overview span { display: flex; gap: 7px; align-items: center; color: var(--dim); font-size: 11px; }
  .overview i { width: 6px; height: 6px; border-radius: 50%; background: var(--dim2); }
  .overview button:nth-child(1) i { background: var(--amber); }
  .overview button:nth-child(3) i { background: var(--cyan); }
  .overview strong { display: block; font-size: 30px; line-height: 1.2; font-weight: 500; margin-top: 12px; letter-spacing: -1px; }
  .overview small { font-size: 10px; color: var(--dim2); margin-left: 8px; font-weight: 400; letter-spacing: 0; }
  .composer { border-radius: 12px; padding: 18px 20px 12px; gap: 14px; background: var(--panel); }
  .composer:focus-within { border-color: #71865e; box-shadow: 0 0 0 3px #b9ed8006; }
  .composer-label { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--dim); font-weight: 600; }
  .composer-label span { color: var(--cyan); font-size: 17px; }
  .composer textarea { min-height: 42px; font-size: 16px; }
  .composer textarea::placeholder { color: #87958b; }
  .composer .row { gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
  .composer select { min-width: 110px; max-width: 200px; font-size: 12px; padding: 0 10px; }
  .composer label.tog { font-size: 11px; gap: 4px; }
  .composer .hint { font-size: 10px; }
  .btn { font-size: 12px; border-radius: 7px; }
  .btn.primary { background: var(--cyan); border-color: var(--cyan); color: #203018; box-shadow: none; }
  .btn.primary:hover:not(:disabled) { background: #caf797; box-shadow: none; opacity: 1; }
  .tabs { margin: 30px 0 0; gap: 20px; }

  /* Infrastructure observatory */
  .network-panel { border: 1px solid #354039; border-radius: 18px; overflow: hidden; background: #151b18; box-shadow: 0 24px 70px #0002; }
  .network-heading { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 26px 30px; border-bottom: 1px solid #2a352e; }
  .network-heading .eyebrow { font-size: 9px; letter-spacing: 2px; }
  .network-heading h2 { font-size: 22px; font-weight: 600; letter-spacing: -.7px; margin: 7px 0 0; }
  .network-health { flex-shrink: 0; font: 10px var(--mono); border: 1px solid #475248; color: var(--dim); border-radius: 30px; padding: 9px 12px; display: inline-flex; gap: 8px; align-items: center; }
  .network-health::before { content:''; width: 5px; height: 5px; background: currentColor; border-radius: 50%; }
  .network-health[data-state=online] { color: var(--cyan); border-color: #b9ed8040; background: #b9ed8007; }
  .network-health[data-state=offline] { color: var(--amber); border-color: #edc27b40; background: #edc27b07; }
  .network-map { position: relative; height: 600px; isolation: isolate; background-image: radial-gradient(ellipse at 50% 42%,#b9ed800a,transparent 50%),radial-gradient(#889e8b24 .7px,transparent .7px); background-size: auto,20px 20px; }
  .map-caption { position:absolute; top:22px; left:28px; font:9px var(--mono); letter-spacing:1.4px; color:#839388; }
  .map-cross { color:var(--cyan); margin-right:8px; }
  .network-wires { position:absolute; inset:0; width:100%; height:100%; z-index:-1; }
  .network-wires path { fill:none; stroke:#617166; stroke-width:1.5; stroke-dasharray:4 7; }
  .network-wires .wire-base { stroke:#324336; stroke-width:6; stroke-dasharray:none; opacity:.35; }
  .network-wires [data-state=online] { stroke:#b9ed80; }
  .network-wires [data-state=offline] { stroke:var(--red); opacity:.6; }
  .network-orbit { position:absolute; left:47%; top:40%; transform:translate(-50%,-50%); border:1px solid #b9ed8014; border-radius:50%; z-index:-1; }
  .orbit-outer { width:330px; height:330px; border-style:dashed; }
  .orbit-inner { width:266px; height:266px; background:#b9ed8003; }
  .network-node { position:absolute; transform:translate(-50%,-50%); width:158px; min-height:136px; background:linear-gradient(145deg,#242e27,#19201c); border:1px solid #48584b; border-radius:14px; display:flex; align-items:center; flex-direction:column; padding:17px 10px 14px; box-shadow:0 12px 25px #0004,inset 0 1px #ffffff08; }
  .node-mac { left:14%; top:40%; }
  .node-saturno { left:74%; top:40%; }
  .node-googleDrive { left:47%; top:85%; min-height:100px; width:186px; padding:12px; }
  .node-aiMemory { left:47%; top:40%; width:182px; min-height:186px; border-color:#b9ed8070; background:linear-gradient(145deg,#31422c,#1c281d); box-shadow:0 0 60px #b9ed800d,0 20px 40px #0005,inset 0 1px #d9ffc530; }
  .node-icon { color:#b9c9bc; width:30px; height:30px; margin-bottom:8px; }
  .node-icon svg,.service-icon svg { width:100%; height:100%; }
  .node-aiMemory .node-icon { color:var(--cyan); width:34px; height:34px; }
  .node-googleDrive .node-icon { width:24px; height:24px; margin-bottom:4px; }
  .network-node strong { font:600 15px 'Manrope',sans-serif; letter-spacing:-.3px; }
  .node-description { font-size:9px; color:#9eaea1; margin-top:3px; }

  .memory-pages small { display:block; color:#a5b59e; font:8px var(--mono); margin-top:1px; }
  /* complemento do mapa: motores, board e os bancos (as origens dos backups) */
  .map-extra { position:absolute; transform:translate(-50%,-50%); display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:12px;
    background:linear-gradient(145deg,#222b25,#181e1a); border:1px solid #48584b; font-size:12px; white-space:nowrap; z-index:1; }

  .network-services { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); border-top:1px solid var(--line); background:#191f1b; }
  .service-card { padding:20px 24px; border-right:1px solid var(--line); }

  /* Grafo da memória: mesma moldura do monitoramento; canvas à esquerda, a página lida à direita */
  .grafo-barra { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 14px 24px; border-bottom: 1px solid var(--line); }
  .grafo-barra input { flex: 1 1 240px; height: 40px; background: var(--panel2); border: 1px solid var(--line2); border-radius: 8px; color: var(--txt); padding: 0 12px; font: inherit; font-size: 13.5px; outline: 0; }
  .grafo-barra input:focus { border-color: var(--cyan); }
  .grafo-projetos { display: flex; flex-wrap: wrap; gap: 6px; }
  .grafo-chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line2); color: var(--dim); font: 11px var(--mono); }

  .grafo-tema.on { color: #0f1311; background: var(--cyan); border-color: var(--cyan); }
  .grafo-rotulo { font: 10px var(--mono); letter-spacing: 1px; text-transform: uppercase; color: var(--dim2); align-self: center; margin-right: 2px; }
  .grafo-barra .grafo-projetos { flex-basis: 100%; }

  .grafo-canvas canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  .grafo-canvas canvas.arrastando { cursor: grabbing; }
  .grafo-dica { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line2); border-radius: 8px; padding: 6px 10px; font-size: 12px; color: var(--txt); max-width: 280px; box-shadow: var(--shadow-lg); }

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const STATUS_LABEL = { pendente: "Pendente", fila: "Na fila", rodando: "Rodando", executada: "Executada", concluida: "Concluída", erro: "Erro" };
// `busy` sem `rodando` é a tarefa respondendo no chat: também está trabalhando, e a tela
// precisa dizer isso — senão o agente trabalha e o quadro continua escrito "Pendente".
const trabalhando = (t) => t.status === "rodando" || t.busy;
// Quando a tarefa em erro volta sozinha — ou por que não volta.
const retryTxt = (t) => {
  if (!t.retentativa) return "";
  const h = new Date(t.retentativa.em).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  return t.retentativa.tipo === "cota" ? `⏸ espera a cota: volta às ${h}` : `↻ volta às ${h} (${t.retentativa.n}/${t.retentativa.max})`;
};
const ETAPA = { agente: "Rodando", portao: "Verificando", revisor: "Revisando", qa: "Testando (QA)", entrega: "Entregando", merge: "Mesclando", deploy: "Publicando" };
const ENTREGA_LABEL = { direto: "Direto na pasta (sem PR)", pr: "Abrir Pull Request (o dono revisa)", deploy: "PR, mesclar e publicar (o board faz tudo)" };
const estado = (t) => t.status === "rodando" ? { cls: "rodando", label: ETAPA[t.etapa] || "Rodando" }
  : t.busy ? { cls: "rodando", label: "Respondendo" }
  : t.status === "fila" && t.acao ? { cls: "fila", label: t.acao === "deploy" ? "Na fila · publicar" : "Na fila · PR" }
  : t.status === "erro" && t.retentativa ? { cls: "fila", label: t.retentativa.tipo === "cota" ? "Esperando cota" : "Vai tentar de novo" }
  : { cls: t.status, label: STATUS_LABEL[t.status] };
// Selos do que já foi conferido: o dono precisa ver "passou no portão" sem abrir a tarefa.
const selos = (t) => [
  t.gate ? `<span class="selo ${t.gate.ok ? "ok" : "nao"}" title="${esc(t.gate.comando)}">⛨ portão ${t.gate.ok ? "✓" : "✗"}</span>` : "",
  t.revisor ? `<span class="selo ${t.revisor.veredito === "APROVADO" ? "ok" : "nao"}">🔍 revisor ${t.revisor.veredito === "APROVADO" ? "✓" : "✗"}</span>` : "",
  t.qa ? `<span class="selo ${t.qa.veredito === "APROVADO" ? "ok" : "nao"}">🧪 QA ${t.qa.veredito === "APROVADO" ? "✓" : "✗"}</span>` : "",
  t.merged ? `<span class="selo ok">⇪ mesclado</span>` : "",
  t.deploy ? `<span class="selo ${t.deploy.ok ? "ok" : "nao"}" title="${esc(t.deploy.comando)}">⇪ publicado ${t.deploy.ok ? "✓" : "✗"}</span>` : "",
].join("");
const ORDER = { rodando: 0, fila: 1, pendente: 2, erro: 3, executada: 4, concluida: 5 };
const fmtCost = (v) => v ? "US$ " + Number(v).toFixed(2) : "";
const cutTxt = (s, n) => { s = String(s || ""); return s.length > n ? s.slice(0, n - 1) + "…" : s; };
const fmtDur = (ms) => { if (!ms) return ""; const m = Math.floor(ms / 60000), s = Math.round((ms % 60000) / 1000); return m ? `${m}min ${s}s` : `${s}s`; };
const fmtAt = (iso) => iso ? new Date(iso).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) : "";
const fmtDay = (iso) => iso ? new Date(iso).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "";
// Há quanto tempo a tarefa está parada — o que faz a aba Pendentes valer como lembrete.
const haQuanto = (iso) => {
  if (!iso) return "";
  const dias = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  return dias >= 1 ? `há ${dias} dia${dias > 1 ? "s" : ""}` : "";
};
// O que um porte faz neste motor: no Claude é esforço (o modelo não muda); nos outros, o modelo do porte.
const efeitoPorte = (motor, p) => {
  const c = CAT[motor || "claude"] || {};
  if (c.portes?.[p]) return c.portes[p];
  if (c.esforcos) return c.esforcos[p] ? "esforço " + c.esforcos[p] : "esforço padrão";
  return "";
};
// "claude-opus-5-5" → "Opus 5.5": o nome que o dono reconhece.
const nomeModelo = (m) => {
  const x = String(m || "");
  const r = x.match(/^claude-(opus|sonnet|haiku)-(\d+)(?:-(\d{1,2})(?!\d))?/i);
  if (r) return r[1][0].toUpperCase() + r[1].slice(1) + " " + r[2] + (r[3] ? "." + r[3] : "");
  if (/^(opus|sonnet|haiku)$/i.test(x)) return x[0].toUpperCase() + x.slice(1);
  return x || "padrão";
};
const rotuloAgente = (t) => `#${t.agente} · ${nomeModelo(t.modeloUsado)}${t.esforcoUsado ? " · " + t.esforcoUsado : ""}`;
// O agente aparece enquanto trabalha; na tarefa ⚡ fica sempre (é a cópia dele).
const agenteSelo = (t) => t.agente && (trabalhando(t) || t.paralelo)
  ? `<span class="agente${trabalhando(t) ? " on" : ""}" title="agente, modelo e esforço desta tarefa${t.paralelo ? " — cópia isolada (⚡ paralelo)" : ""}">${t.paralelo ? "⚡ " : ""}${esc(rotuloAgente(t))}</span>` : "";
const juntarSelo = (t) => {
  const j = (t.worktree || {}).juntar;
  if (j === "ok") return `<span class="selo ok" title="o trabalho da cópia já está na pasta principal">⇲ juntou</span>`;
  if (j === "pendente") return `<span class="selo" title="junta quando a pasta principal estiver livre">⇲ esperando a pasta</span>`;
  if (j === "conflito") return `<span class="selo nao" title="conflito com a pasta principal: nada foi aplicado; o trabalho está em ${esc(t.worktree.dir)}">⚠ não juntou</span>`;
  return "";
};
const store = { get: (k, d) => { try { return JSON.parse(localStorage.getItem("board." + k)) ?? d; } catch { return d; } }, set: (k, v) => { try { localStorage.setItem("board." + k, JSON.stringify(v)); } catch {} } };

// Markdown da resposta do agente → HTML. Escapa ANTES de tudo: o texto vem de um modelo e não é confiável.
function mdInline(s) {
  return s.split(/(`[^`]+`)/g).map((p) => (p.length > 1 && p.startsWith("`") && p.endsWith("`"))
    ? `<code>${p.slice(1, -1)}</code>`
    : p.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*\w])\*(?!\s)([^*]+?)\*(?!\w)/g, "$1<em>$2</em>")
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
  ).join("");
}
function mdToHtml(txt) {
  if (!txt) return "";
  const L = esc(txt).replace(/\r/g, "").split("\n");
  const out = [];
  const isRow = (l) => /^\s*\|.*\|\s*$/.test(l || "");
  const isSep = (l) => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l || "");
  const cells = (l) => l.trim().replace(/^\||\|$/g, "").split("|").map((c) => mdInline(c.trim()));
  const ITEM = /^\s*([-*+]|\d+[.)])\s+/;
  const HR = /^\s*(-{3,}|\*{3,}|_{3,})\s*$/;
  let i = 0;
  while (i < L.length) {
    const l = L[i];
    let m;
    if (/^\s*```/.test(l)) {
      const buf = []; i++;
      while (i < L.length && !/^\s*```/.test(L[i])) buf.push(L[i++]);
      i++;
      out.push(`<pre class="md-code"><code>${buf.join("\n")}</code></pre>`);
    } else if (!l.trim()) {
      i++;
    } else if ((m = l.match(/^(#{1,4})\s+(.*)$/))) {
      const n = Math.min(m[1].length + 1, 4);
      out.push(`<h${n}>${mdInline(m[2])}</h${n}>`); i++;
    } else if (HR.test(l)) {
      out.push("<hr>"); i++;
    } else if (isRow(l) && isSep(L[i + 1])) {
      const head = cells(l); i += 2;
      const rows = [];
      while (i < L.length && isRow(L[i])) rows.push(cells(L[i++]));
      out.push(`<div class="md-tw"><table class="md-table"><thead><tr>${head.map((c) => `<th>${c}</th>`).join("")}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
    } else if (/^\s*&gt;\s?/.test(l)) {
      const buf = [];
      while (i < L.length && /^\s*&gt;\s?/.test(L[i])) buf.push(mdInline(L[i++].replace(/^\s*&gt;\s?/, "")));
      out.push(`<blockquote>${buf.join("<br>")}</blockquote>`);
    } else if (ITEM.test(l)) {
      const ordered = /^\s*\d+[.)]\s+/.test(l), inicio = parseInt(l, 10) || 1, items = [];
      while (i < L.length && ITEM.test(L[i])) {
        const sub = L[i].match(/^\s*/)[0].length >= 2;
        let corpo = mdInline(L[i].replace(ITEM, "")); i++;
        while (i < L.length && L[i].trim() && /^\s{2,}/.test(L[i]) && !ITEM.test(L[i])) corpo += "<br>" + mdInline(L[i++].trim());
        items.push(`<li${sub ? ' class="sub"' : ""}>${corpo}</li>`);
      }
      out.push(ordered ? `<ol${inicio > 1 ? ` start="${inicio}"` : ""}>${items.join("")}</ol>` : `<ul>${items.join("")}</ul>`);
    } else {
      const buf = [mdInline(L[i++])];
      while (i < L.length && L[i].trim() && !/^\s*(```|#{1,4}\s|&gt;)/.test(L[i]) && !ITEM.test(L[i]) && !HR.test(L[i]) && !(isRow(L[i]) && isSep(L[i + 1]))) buf.push(mdInline(L[i++]));
      out.push(`<p>${buf.join("<br>")}</p>`);
    }
  }
  return out.join("");
}

function connect() {

  es.addEventListener("state", () => agendarState());
  es.addEventListener("uso", () => carregarUso());
  es.addEventListener("conversa-limpa", (e) => {
    const { slug } = JSON.parse(e.data);
    logCache["conversa-" + slug] = [];
    if (view.name === "conversa" && view.slug === slug) { delete $("#app").dataset.conversa; renderConversa(); }
  });
  // Texto da conversa chegando aos pedaços (processo vivo): um balão que o bloco final substitui.
  es.addEventListener("parcial", (e) => {
    const { id, texto } = JSON.parse(e.data);
    if (!((view.name === "conversa" || view.name === "detail") && view.id === id)) return;
    const tl = $("#timeline"); if (!tl) return;
    const noFim = window.innerHeight + window.scrollY >= document.body.scrollHeight - 160;
    let b = tl.querySelector(".ao-vivo");
    if (!b) {
      const vazio = tl.querySelector(".empty"); if (vazio) vazio.remove();
      b = document.createElement("div"); b.className = "ev texto ao-vivo";
      tl.insertBefore(b, tl.querySelector(".thinking"));
    }
    b.innerHTML = `<div class="md">${mdToHtml(texto)}</div>`;
    if (noFim) window.scrollTo({ top: document.body.scrollHeight });
  });
  es.addEventListener("log", (e) => {
    const { id, ev } = JSON.parse(e.data);
    (logCache[id] ||= []).push(ev);

// O complemento do mapa: os 4 motores ligados à memória, o board (que copia os dados para o servidor) e as ORIGENS
// dos backups (os bancos das VPSs), lidas da mesma lista do Controle. Nada aqui é inventado: sem leitura, fica cinza.
async function pintarComplementoDoMapa(el, st) {
  const box = el.querySelector('#mapaExtras'), fios = el.querySelector('#mapaFios'); if (!box || !fios) return;
  let ctl = null; try { ctl = await api('/controle', { signal: AbortSignal.timeout(8000) }); } catch {}
  const h = (iso) => iso ? (Date.now() - Date.parse(iso)) / 3600000 : Infinity;
  const peca = (cls, x, y, estado, nome, sub, titulo) => `<div class="map-extra ${cls}" data-state="${estado}" style="left:${x}%;top:${y}%" title="${esc(titulo || '')}"><i></i><span>${esc(nome)}${sub ? `<small>${esc(sub)}</small>` : ''}</span></div>`;
  const motores = st.aiMemory?.motores || [];
  const xs = [26, 40, 54, 68];
  let html = motores.map((m, i) => peca('motor', xs[i] ?? 26 + i * 14, 8, m.memoria && m.captura ? 'online' : 'offline', m.nome, m.memoria && m.captura ? 'memória + captura' : m.memoria ? 'sem captura' : 'desligado')).join('');
  let linhas = motores.map((m, i) => `<path data-state="${m.memoria && m.captura ? 'online' : 'offline'}" d="M${(xs[i] ?? 26 + i * 14) * 10} 64L470 150"/>`).join('');
  const c = st.copiaBoard || ctl?.copiaBoard || {};
  const cEstado = c.quando ? (c.ok === false || h(c.quando) > 2 ? 'offline' : 'online') : 'unknown';
  html += peca('', 14, 74, cEstado, 'board', c.quando ? 'cópia ' + new Date(c.quando).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : 'aguardando a 1ª cópia', 'O board espelha data/ no servidor a cada 30 min');
  html += '<span class="map-rot" style="left:44%;top:74%">dados do board · 30 min</span><span class="map-rot" style="left:14%;top:57%">roda no Mac</span>';
  const origens = (ctl?.backups || []).filter((b) => b.id !== 'memoria' && b.id !== 'board');
  origens.forEach((b, i) => {
    const y = origens.length === 1 ? 40 : 18 + i * (44 / Math.max(1, origens.length - 1));
    const oks = b.rodadas.filter((r) => r.ok), ult = b.rodadas[b.rodadas.length - 1], ok = oks[oks.length - 1];
    const estado = !ok ? 'offline' : (ult && !ult.ok) || h(ok.fim) > 26 ? 'offline' : 'online';
    html += peca('', 92, y, estado, b.nome, ok ? 'backup ' + new Date(ok.fim).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : 'sem backup', b.origem);
    linhas += `<path data-state="${estado}" d="M920 ${y * 6}L740 240"/>`;
  });
  if (origens.length) html += '<span class="map-rot" style="left:84%;top:67%">backup dos bancos</span>';
  html += '<span class="map-rot" style="left:63%;top:85%">backup toda madrugada</span><span class="map-rot" style="left:47%;top:15%">MCP + captura</span>';
  box.innerHTML = html;
  fios.querySelectorAll('[data-extra]').forEach((p) => p.remove());
  fios.insertAdjacentHTML('beforeend', linhas.replaceAll('<path ', '<path data-extra="1" '));
  fios.querySelector('[data-wire="board"]').dataset.state = st.mac?.online ? 'online' : 'unknown';
  fios.querySelector('[data-wire="copia"]').dataset.state = cEstado;
}

        }

      el.querySelector('#memoryPages').innerHTML = `${memoryOnline ? Number(st.aiMemory.pages || 0).toLocaleString('pt-BR') : '—'} <small>páginas indexadas</small>`;
      for (const key of ['mac','saturno','googleDrive']) el.querySelector(`[data-wire="${key}"]`).dataset.state = memoryOnline && st[key]?.online === true ? 'online' : 'offline';
      const health = el.querySelector('#networkHealth');
      health.dataset.state = onlineCount === 4 ? 'online' : 'offline';
      health.textContent = onlineCount === 4 ? 'Todos os serviços online' : `${onlineCount} de 4 serviços online`;
      el.querySelector('#monTime').textContent = `Última leitura · ${new Date().toLocaleTimeString('pt-BR')}`;
      pintarDocker(el, st.docker, st.timestamp);
      pintarMemoria(el, st);
      pintarComplementoDoMapa(el, st);
    } catch {
      if (!current()) return;
      el.querySelector('#networkHealth').textContent = 'Não foi possível atualizar';
      el.querySelector('#networkHealth').dataset.state = 'unknown';
      el.querySelector('#monTime').textContent = 'Sem leitura atual · tentando novamente';

      const dh = el.querySelector('#dockerHealth'); if (dh) { dh.dataset.state = 'unknown'; dh.textContent = 'Sem leitura'; }
    } finally {
      if (current()) monitorTimer = setTimeout(updateMon, 3000);
    }
  }
  updateMon();
}

// `criada`: a linha da aba Pendentes — mostra quando a tarefa entrou no quadro no lugar do status

function taskRow(t, { criada = false } = {}) {
  const last = lastLine[t.id];
  const e = estado(t);
  const lastTxt = trabalhando(t) && last ? (last.t === "ferramenta" ? `▸ ${last.nome}: ${last.alvo}` : last.texto)
    : (t.status === "erro" ? (retryTxt(t) ? retryTxt(t) + " · " : "") + (t.error || "") : "");
  const canRun = !trabalhando(t) && ["pendente", "executada", "erro", "concluida"].includes(t.status);
  const idade = criada ? haQuanto(t.createdAt) : "";
  return `<div class="task ${e.cls}" data-id="${t.id}" draggable="${!criada && t.status !== "concluida"}">
    <button class="chk ${t.status === "concluida" ? "on" : ""}" title="${t.status === "concluida" ? "Reabrir" : "Marcar como concluída"}" onclick="toggleDone(${t.id})">${t.status === "concluida" ? "✓" : ""}</button>
    <div class="main" role="link" tabindex="0" onkeydown="if(event.key==='Enter')location.hash='#/t/${t.id}'" onclick="location.hash='#/t/${t.id}'">
      <div class="title">${esc(t.title)}</div>
      <div class="meta"><span>#${t.id}</span><span class="proj">${esc(t.project)}</span>${agenteSelo(t)}${juntarSelo(t)}${idade ? `<span class="idade" title="parada desde ${esc(fmtDay(t.createdAt))}">${esc(idade)}</span>` : ""}${t.entrega === "pr" || t.entrega === "deploy" ? `<span class="tag-pr">PR</span>` : ""}${t.anexos?.length ? `<span title="${t.anexos.length} anexo(s): imagem ou PDF">🖼 ${t.anexos.length}</span>` : ""}${motorSelo(t)}${selos(t)}${t.prUrl ? `<a class="prlink" href="${esc(t.prUrl)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">↗ PR</a>` : ""}${t.cost ? `<span>${fmtCost(t.cost)}</span>` : ""}${lastTxt ? `<span class="last">${esc(lastTxt)}</span>` : ""}</div>
    </div>
    <div class="right">
      <div class="acts">
        ${t.status === "rodando" ? `<button class="ib" title="Parar" onclick="stopTask(${t.id})">⏹</button>` : ""}
        ${t.busy && t.status !== "rodando" ? `<span class="ib" title="Respondendo no chat">💬</span>` : ""}
        ${t.status === "fila" ? `<button class="ib" title="Tirar da fila" onclick="setStatus(${t.id},'pendente')">⏸</button>` : ""}
        ${canRun ? `<button class="ib" title="${t.sessionId ? "Rodar de novo (continua a sessão)" : "Colocar na fila"}" onclick="setStatus(${t.id},'fila')">▶</button>` : ""}
        <button class="ib" title="Abrir a tarefa" onclick="location.hash='#/t/${t.id}'">↗</button>
        <button class="ib del" title="Excluir" onclick="delTask(${t.id})">🗑</button>
      </div>
      ${criada && !trabalhando(t) ? `<span class="pill pendente" title="incluída no quadro em ${esc(fmtDay(t.createdAt))}">${fmtDay(t.createdAt) || "Pendente"}</span>`
        : t.status === "concluida" && !t.busy ? `<span class="pill concluida">${fmtDay(t.finishedAt) || "Concluída"}</span>`
        : t.status === "executada" && !t.busy ? `<span class="pill executada">${fmtDay(t.finishedAt) || "Executada"}</span>`
        : `<span class="pill ${e.cls}">${e.label}</span>${trabalhando(t) ? "" : `<span class="grip" title="Arraste pra reordenar">⋮⋮</span>`}`}
    </div>
  </div>`;
}
/** Aba Pendentes: as tarefas fora da fila, agrupadas por projeto (já chegam ordenadas). */
function gruposPendentes(tarefas) {
  const grupos = new Map();
  for (const t of tarefas) (grupos.get(t.project) || grupos.set(t.project, []).get(t.project)).push(t);

// Imagens que o dono colou/arrastou e ainda não foram enviadas (caixa de incluir e chat).
const pendentes = { incluir: [], chat: [], conversa: [] };
// O que o servidor aceita (ele confere pelos bytes; aqui é só pra avisar na hora).
const ANEXO_TIPOS = /^(image\/(png|jpeg|gif|webp)|application\/pdf)$/;
const ANEXO_EXTS = /\.(png|jpe?g|gif|webp|pdf)$/i;
const ehPdf = (nome) => /\.pdf$/i.test(nome || "");
const pdfHtml = (nome) => `<span class="pdf"><b>📄 PDF</b><span>${esc(nome || "documento.pdf")}</span></span>`;
async function subirImagens(onde, arquivos) {
  const todos = [...arquivos].filter(Boolean);
  const aceita = (f) => f.type ? ANEXO_TIPOS.test(f.type) : ANEXO_EXTS.test(f.name || "");
  const fotos = todos.filter(aceita), fora = todos.filter((f) => !aceita(f));
  // Nunca recusar em silêncio: o dono achou que o 📎 estava quebrado (24/09).
  if (fora.length) toast(`não aceito ${fora.map((f) => f.name || f.type || "esse arquivo").join(", ")} — só imagem (png, jpg, gif, webp) ou PDF`);
  if (!fotos.length) return;
  if (pendentes[onde].length + fotos.length > 6) return toast("no máximo 6 anexos por vez");
  for (const f of fotos) {
    const pdf = f.type === "application/pdf" || ehPdf(f.name);
    const marca = { id: null, nome: f.name || (pdf ? "documento.pdf" : "print.png"), pdf, subindo: true, previa: pdf ? null : URL.createObjectURL(f) };
    pendentes[onde].push(marca); pintarAnexos(onde);
    try {
      const r = await fetch(`/api/anexos?nome=${encodeURIComponent(marca.nome)}`, { method: "POST", headers: { "content-type": f.type }, body: f });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || "não consegui subir o anexo");
      marca.id = d.anexo.id; marca.subindo = false;
    } catch (e) { toast(e.message); pendentes[onde] = pendentes[onde].filter((x) => x !== marca); }
    pintarAnexos(onde);
  }
}
function tirarAnexo(onde, i) { pendentes[onde].splice(i, 1); pintarAnexos(onde); }
function pintarAnexos(onde) {
  const el = $(onde === "incluir" ? "#anexosIncluir" : onde === "conversa" ? "#anexosConversa" : "#anexosChat"); if (!el) return;
  el.innerHTML = pendentes[onde].map((a, i) => a.subindo
    ? `<div class="anexo subindo">subindo…</div>`
    : `<div class="anexo" title="${esc(a.nome)}">${a.pdf ? pdfHtml(a.nome) : `<img src="${esc(a.previa || "/api/anexos/" + a.id)}" alt="${esc(a.nome)}">`}<span class="x" onclick="tirarAnexo('${onde}',${i})">×</span></div>`).join("");
  el.hidden = !pendentes[onde].length;
}
/** Colar, arrastar e escolher arquivo — os três caminhos que o dono usa pra mandar print. */
function ligarImagens(onde, campo, caixa) {
  if (!campo) return;
  campo.addEventListener("paste", (e) => { const f = e.clipboardData?.files; if (f && f.length) { e.preventDefault(); subirImagens(onde, f); } });
  if (!caixa) return;
  caixa.addEventListener("dragover", (e) => { e.preventDefault(); caixa.classList.add("arrastando"); });
  caixa.addEventListener("dragleave", () => caixa.classList.remove("arrastando"));
  caixa.addEventListener("drop", (e) => { e.preventDefault(); caixa.classList.remove("arrastando"); subirImagens(onde, e.dataTransfer.files); });
}
const idsAnexos = (onde) => pendentes[onde].filter((a) => a.id).map((a) => ({ id: a.id, nome: a.nome }));

// arrastar pra reordenar (a ordem manda em quem roda primeiro na fila)
function bindDrag() {
  const list = $("#list"); if (!list) return;
  let dragging = null;
  list.querySelectorAll(".task").forEach((el) => {
    el.addEventListener("dragstart", () => { dragging = el; el.classList.add("dragging"); });
    el.addEventListener("dragend", () => { el.classList.remove("dragging"); list.querySelectorAll(".over").forEach((x) => x.classList.remove("over")); });
    el.addEventListener("dragover", (e) => { e.preventDefault(); if (el !== dragging) el.classList.add("over"); });
    el.addEventListener("dragleave", () => el.classList.remove("over"));
    el.addEventListener("drop", async (e) => {
      e.preventDefault(); el.classList.remove("over");
      if (!dragging || dragging === el) return;
      const r = el.getBoundingClientRect();
      (e.clientY < r.top + r.height / 2) ? el.before(dragging) : el.after(dragging);
      // Só as tarefas VISÍVEIS mudam de lugar: as escondidas pelo filtro ficam nas suas
      // posições globais. Sem isto, arrastar com filtro ligado jogava os outros projetos
      // para o fim da fila — e a ordem da fila é quem roda primeiro.
      const visible = [...list.querySelectorAll(".task")].map((x) => Number(x.dataset.id));
      const global = S.tasks.slice().sort((a, b) => a.order - b.order).map((t) => t.id);
      const slots = global.map((id, i) => (visible.includes(id) ? i : -1)).filter((i) => i >= 0);
      const ids = global.slice();
      slots.forEach((slot, k) => { ids[slot] = visible[k]; });
      try { await api("/tasks/reorder", { method: "POST", body: { ids } }); } catch (err) { toast(err.message); }
    });
  });
}
