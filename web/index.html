  const modelo = (($("#convModelo") || {}).value || "").replace(/^modelo:/, "");
  try {
    await api(`/conversa/${slug}`, { method: "POST", body: { texto: t || "(imagem)", anexos: idsAnexos("conversa"),
      motor: ($("#convMotor") || {}).value, modelo } });
    if (texto === undefined) { ta.value = ""; ta.style.height = "auto"; }
    pendentes.conversa = []; pintarAnexos("conversa");
  } catch (e) { toast(e.message); }
}
async function limparConversa(slug) {
  if (!confirm("Começar um fio novo? O agente esquece esta conversa e o histórico some da tela.")) return;
  try { await api(`/conversa/${slug}/limpar`, { method: "POST" }); } catch (e) { toast(e.message); }
}
async function pararConversa(slug) { try { await api(`/conversa/${slug}/parar`, { method: "POST" }); } catch (e) { toast(e.message); } }

// ── Busca semântica (a aba 🔎 Buscar) ────────────────────────────────────────
// O quadro tem tarefa de todo projeto e o dono não lembra número nem título exato. Aqui ele
// descreve com as palavras dele e o servidor compara o SENTIDO (embeddings) — ou, quando não há
// provedor de embeddings no ar, procura por palavra e DIZ que foi assim (a tela não finge IA).
let BUSCA = { q: "", projeto: "todos", res: null, buscando: false, info: null, hist: [] };

function buscaHead() {
  const projetos = [{ slug: "todos", label: "todos os projetos" }, ...(S.projects || [])];
  return `<div class="bhead">
    <div class="brow1">
      <div class="search-box">
        <input id="buscaIn" aria-label="Buscar tarefas" type="text" placeholder="Descreva a tarefa com as suas palavras… (Enter busca)" value="${esc(BUSCA.q)}">
        <button type="button" class="clear-btn" id="clearBtn" title="Limpar busca" aria-label="Limpar busca">✕</button>
      </div>
      <select id="buscaProj" title="Buscar em qual projeto">
        ${projetos.map((p) => `<option value="${esc(p.slug)}" ${p.slug === BUSCA.projeto ? "selected" : ""}>${esc(p.label)}</option>`).join("")}
      </select>
      <button class="btn primary" id="buscaBtn">Buscar</button>
    </div>
    <div class="hint" id="buscaEstado">conferindo o provedor de busca…</div>
  </div>`;
}

const MODO_TXT = { semantica: "por sentido", lexico: "por palavra" };
function buscaResultadosHtml() {
  const r = BUSCA.res;
  if (BUSCA.buscando) return `<div class="empty">buscando…</div>`;
  if (!r) return `<div class="empty">Escreva o que você procura — vale descrever de memória: <i>"aquela do rate limit que ficou no nginx"</i>.</div>`;
  if (!r.resultados.length) return `<div class="empty">Nada parecido com <b>${esc(r.consulta)}</b>${r.projeto && r.projeto !== "todos" ? ` em ${esc(r.projeto)}` : ""}.</div>`;
  return `<div class="bcount">${r.resultados.length} tarefa(s) · busca ${MODO_TXT[r.modo] || r.modo}${r.modo === "semantica" ? ` (${esc(r.provedor)})` : ""} · ${r.ms} ms${r.aviso ? ` · ${esc(r.aviso)}` : ""}</div>`
    + r.resultados.map((t) => {
      const pct = Math.round(t.score * 100);
      return `<div class="bres" onclick="location.hash='#/t/${t.id}'">
        <div class="bscore" title="parecença com o que você escreveu"><div class="bbar"><i style="width:${pct}%"></i></div><span>${pct}%</span></div>
        <div class="bmain">
          <div class="title">${esc(t.title)}</div>
          <div class="meta"><span>#${t.id}</span><span class="proj">${esc(t.project)}</span><span class="pill ${esc(t.status)}" style="min-width:0">${esc(STATUS_LABEL[t.status] || t.status)}</span>${t.entrega === "pr" || t.entrega === "deploy" ? `<span class="tag-pr">PR</span>` : ""}<span>${esc(fmtDay(t.finishedAt || t.createdAt))}</span></div>
          <div class="btrecho">${esc(t.trecho)}</div>
        </div>
      </div>`;
    }).join("");
}

function buscaHistoricoHtml() {
  if (!BUSCA.hist.length) return "";
  // O texto da consulta vai pelo ÍNDICE, não interpolado no onclick: consulta com aspas ou < >
  // viraria HTML quebrado (ou pior) no meio do atributo.
  return `<div class="bhist"><h3>Buscas recentes</h3>${BUSCA.hist.map((h, i) => `
    <div class="bh" onclick="refazerBusca(${i})">
      <span class="q">${esc(h.consulta)}</span>
      <span class="s">${esc(fmtDay(h.at))} · ${esc(h.projeto || "todos")} · ${MODO_TXT[h.modo] || esc(h.modo)} · ${(h.achados || []).length ? (h.achados || []).map((a) => "#" + a.id).join(" ") : "nada"}</span>
    </div>`).join("")}</div>`;
}

function refazerBusca(i) {
  const h = BUSCA.hist[i]; if (!h) return;
  const c = $("#buscaIn"); if (c) c.value = h.consulta;
  fazerBusca();
}

async function renderBusca() {
  const app = $("#app");
  const voltar = `<button class="back" onclick="location.hash=''">← voltar</button>`;
  // Já estou na busca: o board manda evento o tempo todo — redesenhar apagaria o que ele digita.
  if (app.dataset.busca === "1" && $("#buscaIn")) { renderHeader(); return; }
  app.dataset.busca = "1"; delete app.dataset.task; delete app.dataset.conversa;
  app.className = "wrap";
  BUSCA.projeto = store.get("buscaProjeto", "todos");
  if (!(S.projects || []).some((p) => p.slug === BUSCA.projeto)) BUSCA.projeto = "todos";
  app.innerHTML = headerHtml(voltar) + workspaceIntro('busca') + buscaHead()
    + `<div id="buscaRes">${buscaResultadosHtml()}</div><div id="buscaHist">${buscaHistoricoHtml()}</div>`;
  const campo = $("#buscaIn");
  let timeoDebounce;
  campo.addEventListener("input", () => {
    clearTimeout(timeoDebounce);
    if (campo.value.trim().length < 2) { BUSCA.res = null; pintarBusca(); return; }
    timeoDebounce = setTimeout(() => fazerBusca(), 300);
  });
  campo.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); clearTimeout(timeoDebounce); fazerBusca(); } });
  $("#clearBtn").onclick = () => { campo.value = ""; BUSCA.res = null; BUSCA.q = ""; pintarBusca(); campo.focus(); };
  $("#buscaBtn").onclick = () => fazerBusca();
  $("#buscaProj").onchange = (e) => { BUSCA.projeto = e.target.value; store.set("buscaProjeto", e.target.value); if (BUSCA.q && BUSCA.q.length >= 2) fazerBusca(); };
  campo.focus(); campo.setSelectionRange(campo.value.length, campo.value.length);
  carregarEstadoBusca();
  carregarHistoricoBusca();
}

async function fazerBusca() {
  const campo = $("#buscaIn"); if (!campo) return;
  const q = campo.value.trim();
  if (!q) return;
  BUSCA.q = q; BUSCA.buscando = true; pintarBusca();
  try {
    const [tarefas, mem] = await Promise.all([
      api(`/busca?q=${encodeURIComponent(q)}&projeto=${encodeURIComponent(BUSCA.projeto)}`),
      api(`/romaneio/previa?todas=1&texto=${encodeURIComponent(q)}&projeto=${encodeURIComponent(BUSCA.projeto === "todos" ? "DEV" : BUSCA.projeto)}`).catch(() => null),
    ]);
    BUSCA.res = { ...tarefas, projeto: BUSCA.projeto };
    BUSCA.mem = mem;
  } catch (e) { toast(e.message); BUSCA.res = null; BUSCA.mem = null; }
  BUSCA.buscando = false;
  pintarBusca();
  carregarHistoricoBusca();
  carregarEstadoBusca(); // a busca pode ter caído no socorro: o rodapé conta a verdade
}

function pintarBusca() { const el = $("#buscaRes"); if (el) el.innerHTML = buscaMemoriaHtml() + buscaResultadosHtml(); } // a memória primeiro: é ela que responde "já tratei disso?"
// "Já tratei disso?": o mesmo picking do romaneio, mostrando o que a memória compartilhada tem sobre a busca.
function buscaMemoriaHtml() {
  if (!BUSCA.res || !BUSCA.q) return "";
  const m = BUSCA.mem;
  const itens = m && m.itens ? m.itens.filter((i) => i.nota > 0).sort((a, b) => b.nota - a.nota) : [];
  const corpo = !m ? `<div class="docker-vazio">não consegui consultar a memória</div>`
    : m.vazio ? `<div class="docker-vazio">${esc(m.motivo === "endereçamento não aprovado" ? "a memória ainda não tem o endereçamento aprovado" : "nada na memória sobre isso")}</div>`
    : !itens.length ? `<div class="docker-vazio">nada na memória sobre isso</div>`
    : itens.map((i) => `<button class="mem-hit" onclick="irParaMemoria(${esc(JSON.stringify(i.chave))})"><span>${ICONE_MENTE[i.mente] || ""} ${esc(i.titulo)}</span><small>${esc(i.chave.split("/")[0])} · relevância ${i.nota}</small></button>`).join("");
  return `<section class="busca-mem"><div class="busca-mem-cab"><b>Na memória</b><span>o que os agentes já guardaram sobre isso · abre no menu Memória</span></div>${corpo}</section>`;
}

async function carregarEstadoBusca() {
  try { BUSCA.info = await api("/busca/estado"); } catch { return; }
  const el = $("#buscaEstado"); if (!el) return;
  const i = BUSCA.info;
  const onde = i.local ? "na sua máquina" : "em serviço externo — o texto das tarefas sai daqui";
  el.innerHTML = i.pronto && i.modo === "semantica"
    ? `busca por sentido · ${esc(i.provedor)}${i.modelo ? " · " + esc(i.modelo) : ""} (${esc(onde)}) · ${i.indexados}/${i.total} tarefas no índice <button class="linkish" onclick="reindexarBusca()">↻ reindexar</button>`
    : `⚠ ${esc(i.motivo || "sem provedor de embeddings")} · para ligar a busca por sentido: instale o ollama (<code>ollama pull nomic-embed-text</code>) ou escolha outro provedor em BOARD_BUSCA_PROVEDOR`;
}

async function carregarHistoricoBusca() {
  try { BUSCA.hist = (await api("/busca/historico?n=20")).buscas || []; } catch { return; }
  const el = $("#buscaHist"); if (el) el.innerHTML = buscaHistoricoHtml();
}

async function reindexarBusca() {
  toast("recalculando o índice…");
  try { const r = await api("/busca/reindexar", { method: "POST" }); toast(`índice refeito: ${r.total} tarefa(s)`); }
  catch (e) { toast(e.message); }
  carregarEstadoBusca();
}

// Mostra o motor quando não é o padrão do board, e o modelo quando o dono escolheu um.
const motorSelo = (t) => {
  const padrao = (S.config || {}).motor || "claude";
  const partes = [t.motor && t.motor !== padrao ? (S.motores || []).find((m) => m.id === t.motor)?.rotulo || t.motor : "", t.modelo || (t.porte ? "porte " + t.porte + (t.porteAuto ? " · auto" : "") : "")].filter(Boolean);
  return partes.length ? `<span class="selo" title="motor e modelo desta tarefa">${esc(partes.join(" · "))}</span>` : "";
};
const fotosHtml = (anexos) => !anexos?.length ? "" :
  `<div class="fotos">${anexos.map((a) => `<a href="/api/anexos/${esc(a.id)}" target="_blank" rel="noopener" title="${esc(a.nome || "")}">${ehPdf(a.id) ? pdfHtml(a.nome) : `<img src="/api/anexos/${esc(a.id)}" alt="${esc(a.nome || "imagem")}">`}</a>`).join("")}</div>`;

const ICONE_MENTE = { dono: "🧭", marketplace: "🚚", fiscal: "🧾", financeiro: "💰", whatsapp: "💬", comercial: "📣", design: "🎨", engenharia: "🛠️", seguranca: "🛡️", triagem: "📥" };
function irParaMemoria(chave) { GE.sel = chave; navigateBoard("memoria"); }
function eventHtml(ev) {
  const at = `<div class="at">${fmtAt(ev.at)}</div>`;
  switch (ev.t) {
    case "dono": return `<div class="ev dono">${at}${esc(ev.texto)}${fotosHtml(ev.anexos)}</div>`;
    case "texto": return `<div class="ev texto">${at}${ev.quem === "revisor" ? `<span class="tag-pr" style="margin-right:6px">REVISOR</span>` : ev.quem === "qa" ? `<span class="tag-pr" style="margin-right:6px;color:var(--c-qa);border-color:var(--c-qa)">QA</span>` : ""}<div class="md">${mdToHtml(ev.texto)}</div></div>`;
    case "ferramenta": return `<div class="ev ferramenta ${ev.quem === "revisor" ? "rev" : ""}" title="${esc(ev.alvo)}">${ev.quem === "revisor" ? "🔍" : ev.quem === "qa" ? "🧪" : "▸"} <b>${esc(ev.nome)}</b> ${esc(ev.alvo)}</div>`;
    case "resultado": {
      const k = `<div class="k"><span>resultado</span>${ev.custo ? `<span>${fmtCost(ev.custo)}</span>` : ""}${ev.turnos ? `<span>${ev.turnos} turno(s)</span>` : ""}${ev.dur ? `<span>${fmtDur(ev.dur)}</span>` : ""}</div>`;
      // O resultado repete a última fala do agente: então só o rodapé com custo/tempo.
      if (ev.dup) return `<div class="ev resultado slim">${k}</div>`;
      return `<div class="ev resultado">${k}<div class="md">${mdToHtml(ev.texto || "(sem texto)")}</div></div>`;
    }
    case "portao": {
      if (ev.estado === "rodando") return `<div class="ev mark">⛨ ${fmtAt(ev.at)} · portão rodando <code>${esc(ev.comando)}</code></div>`;
      const ok = ev.estado === "passou";
      return `<div class="ev portao ${ok ? "ok" : "nao"}"><div class="k"><span>⛨ portão ${ok ? "passou" : "falhou"}</span><span>${esc(ev.comando)}</span>${ok ? "" : `<span>código ${ev.code}</span>`}</div>${ok ? "" : `<pre>${esc(ev.saida || "")}</pre>`}</div>`;
    }
    case "retentativa": {
      if (ev.estado === "passagem") return `<div class="ev mark" style="color:var(--amber)">${esc(ev.texto || "")}</div>`;
      const cor = ev.estado === "esgotada" || ev.estado === "manual" ? "err" : "";
      return `<div class="ev mark ${cor}">↻ ${fmtAt(ev.at)} · ${esc(ev.texto || "")}</div>`;
    }
    case "passo": {
      const nome = ev.nome === "merge" ? "mesclar o PR" : "publicar";
      if (ev.estado === "rodando") return `<div class="ev mark">⇪ ${fmtAt(ev.at)} · ${nome} <code>${esc(cutTxt(ev.comando, 90))}</code></div>`;
      const ok = ev.estado === "passou";
      return `<div class="ev portao ${ok ? "ok" : "nao"}"><div class="k"><span>⇪ ${nome} ${ok ? "ok" : "falhou"}</span><span>${esc(cutTxt(ev.comando, 70))}</span>${ok ? "" : `<span>código ${ev.code}</span>`}</div>${ok ? "" : `<pre>${esc(ev.saida || "")}</pre>`}</div>`;
    }
    case "revisor":
    case "qa": {
      const ok = ev.veredito === "APROVADO";
      return `<div class="ev revisor ${ok ? "ok" : "nao"}"><div class="k"><span>${ev.t === "qa" ? "🧪 QA" : "🔍 revisor"}: ${esc(ev.veredito)}</span>${ev.custo ? `<span>${fmtCost(ev.custo)}</span>` : ""}</div><div class="txt">${esc(ev.texto || "")}</div></div>`;
    }
    case "romaneio": {
      const itens = ev.itens || [];
      return `<details class="ev romaneio"><summary>📦 romaneio · ${itens.length} memórias · ~${Number(ev.tokens || 0).toLocaleString("pt-BR")} tokens · mentes: ${(ev.mentes || []).map((m) => ICONE_MENTE[m] || "").join(" ")} ${esc((ev.mentes || []).join(", "))}</summary>`
        + `<div class="rom-lista">${itens.map((i) => `<button onclick="irParaMemoria(${esc(JSON.stringify(i.chave))})" title="abrir na Memória">${ICONE_MENTE[i.mente] || ""} ${esc(i.titulo)}${i.nota ? `<small>${i.nota}</small>` : ""}</button>`).join("")}</div></details>`;
    }
    case "inicio": return `<div class="ev mark">▶ ${fmtDay(ev.at)} · começou em ${esc(ev.projeto)}</div>`;
    case "fim": return `<div class="ev mark ${ev.status === "erro" ? "err" : ""}">${ev.status === "erro" ? "✗" : "■"} ${fmtAt(ev.at)} · ${esc(ev.status)}${ev.motivo ? " — " + esc(ev.motivo) : ""}</div>`;
    default: return `<div class="ev solto">${esc(ev.texto)}</div>`;
  }
}
let lastText = null; // última fala do agente na tela — pra não repetir no resultado
function appendEvent(ev, scroll = true) {
  const tl = $("#timeline"); if (!tl) return;
  if (ev.t === "texto") lastText = (ev.texto || "").trim();
  if (ev.t === "resultado") { ev = { ...ev, dup: (ev.texto || "").trim() === lastText }; lastText = null; }
  const vivo = tl.querySelector(".ao-vivo"); if (vivo) vivo.remove();
  const empty = tl.querySelector(".empty"); if (empty) empty.remove();
  const th = tl.querySelector(".thinking"); if (th) th.remove();
  // a mesma "resultado" já chegou no evento texto anterior? mantém os dois: o resultado tem custo.
  tl.insertAdjacentHTML("beforeend", eventHtml(ev));
  if (ev.t !== "fim" && ev.t !== "resultado") showThinking();
  // Só acompanha quem já está no fim: puxar a tela de quem subiu para ler é pior que não rolar.
  const noFim = window.innerHeight + window.scrollY >= document.body.scrollHeight - 160;
  if (scroll && noFim) window.scrollTo({ top: document.body.scrollHeight });
}
function showThinking() {
  const tl = $("#timeline"); if (!tl || tl.querySelector(".thinking")) return;
  const ocupado = view.name === "conversa"
    ? !!((S.conversas || {})[view.slug] || {}).busy
    : (() => { const t = S.tasks.find((x) => x.id === view.id); return !!(t && (t.busy || t.status === "rodando")); })();
  if (ocupado) tl.insertAdjacentHTML("beforeend", `<div class="thinking">trabalhando</div>`);
}
// Publicar só existe onde o dono declarou o comando (data/deploy.json) — sem isso, nem aparece.
const podePublicar = (t) => !!(S.deploys || {})[t.project];

async function abrirTmux() {
  try { await api("/agentes/tmux", { method: "POST" }); toast("Abrindo o Terminal na sessão tmux board-agentes: uma aba por agente.", 4000, "info"); } catch (e) { toast(e.message); }
}
async function filaPausar(pausar) {
  try { await api(pausar ? "/fila/pausar" : "/fila/retomar", { method: "POST" }); toast(pausar ? "Fila pausada: o que está rodando termina, nada novo começa." : "Fila retomada.", 4000); } catch (e) { toast(e.message); }
}
async function reiniciar() {
  try { const r = await api("/reiniciar", { method: "POST" }); toast(r.aviso, 5000); } catch (e) { toast(e.message); }
}
function semDeploy(proj) {
  // O arquivo é lido a cada pedido: basta salvar e recarregar a página, sem reiniciar o board.
  toast(`Publicação desligada para ${proj}. Para ligar, escreva o comando em board/data/deploy.json, ex.: {"${proj}": "./deploy.sh"} e recarregue a página.`, 9000);
}
// Quanto do plano de cada motor já foi usado — ajuda a escolher pra quem passar.
const cotaDoMotor = (id) => pctUso((USO && USO.motores || {})[id]);
const cotaSelo = (id) => { const p = cotaDoMotor(id); return p == null ? "" : ` <b style="font-weight:600;color:var(--${p >= ((USO && USO.teto) || 98) ? "red" : p >= 70 ? "amber" : "dim"})">${p}%</b>`; };
const cotaTxt = (id) => { const p = cotaDoMotor(id); return p == null ? "" : ` · plano em ${p}% de uso`; };

async function passarBastao(id, motor) {
  try { await api(`/tasks/${id}/passar`, { method: "POST", body: { motor } }); toast("Bastão passado: a tarefa voltou pra fila no outro motor.", 5000); }
  catch (e) { toast(e.message); }
}
async function virarPR(id) {
  try { await api(`/tasks/${id}/pr`, { method: "POST" }); } catch (e) { toast(e.message); }
}
async function publicar(id) {
  const t = S.tasks.find((x) => x.id === id);
  const cmd = (S.deploys || {})[t.project];
  if (!confirm(`Isto vai MESCLAR o PR e PUBLICAR o projeto ${t.project}:\n\n$ ${cmd}\n\nSó acontece se o portão passar e o revisor aprovar. Confirma?`)) return;
  try { await api(`/tasks/${id}/publicar`, { method: "POST" }); } catch (e) { toast(e.message); }
}

function bindEntrega(id) {
  const sel = $("#entregaTask"); if (!sel) return;
  sel.onchange = async (e) => { try { await api(`/tasks/${id}`, { method: "PATCH", body: { entrega: e.target.value } }); } catch (err) { toast(err.message); } };
}
async function sendChat(id) {
  const ta = $("#chatIn"); const text = ta.value.trim(); if (!text && !idsAnexos("chat").length) return;
  try {
    await api(`/tasks/${id}/chat`, { method: "POST", body: { text, anexos: idsAnexos("chat") } });
    ta.value = ""; ta.style.height = "auto"; pendentes.chat = []; pintarAnexos("chat");
  } catch (e) { toast(e.message); }
}

route();
connect();
carregarUso();
carregarModelos();
setInterval(() => carregarUso(), 5 * 60000);
setInterval(() => { if (view.name === "list" && store.get("tab", "ativas") === "consumo") renderPlano(); }, 60000); // "lido há N min" e "em Xh" andam
</script>
